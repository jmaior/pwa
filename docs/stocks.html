<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Stock Prices</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#354a5f;min-height:100dvh;display:flex;align-items:center;justify-content:center}
    .box{background:#fff;border-radius:16px;padding:36px 32px;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:20px}
    h1{font-size:20px;font-weight:700;color:#354a5f;text-align:center}
    label{font-size:13px;color:#555;margin-bottom:4px;display:block}
    input[type=password]{width:100%;padding:10px 14px;border:1px solid #ccc;border-radius:8px;font-size:15px;outline:none}
    input[type=password]:focus{border-color:#354a5f}
    button{background:#354a5f;color:#fff;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:600;cursor:pointer}
    button:active{background:#253547}
    .err{font-size:13px;color:#c23934;text-align:center;display:none}
  </style>
</head>
<body>
<div class="box">

  <form id="f" autocomplete="on">

    <input id="pw" type="password" name="password" autocomplete="current-password" autofocus/>

  <button onclick="unlock()">Unlock</button>
  <p class="err" id="err">Incorrect password.</p>
</div>

  document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); unlock(); });

  async function unlock() {
    const pw = document.getElementById('pw').value;
    if (!pw) return;
    try {
      const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      const k  = await crypto.subtle.deriveKey(
        { name:'PBKDF2', salt:SALT, iterations:200000, hash:'SHA-256' },
        km, { name:'AES-GCM', length:256 }, false, ['decrypt']
      );
      const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:IV }, k, CT);
      const html = new TextDecoder().decode(pt);
      document.open(); document.write(html); document.close();
    } catch {
      document.getElementById('err').style.display = 'block';
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();
    }
  }
