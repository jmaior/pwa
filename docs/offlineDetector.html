<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connectivity Detector</title>
  <meta name="version" content="1.1.0" />
</head>
<body>
  <div id="status">CHECKING…</div>
  <div id="detail"></div>
  <div id="log"></div>

  <button id="copy-btn">Copy Source Code</button>
  <div id="version">v1.1.0</div>

  <script>
    // ============================================================
    //  THEME SYNC WITH SAP FSA
    //  FSA passes a context object via window.sap.ushell.Container
    //  (or a postMessage channel) that includes the active theme.
    //  We read it here so this PWA matches the FSA dark/light mode.
    // ============================================================

    // Apply a theme name ("dark" or "light") to the <html> element.
    // All colour rules key off data-theme so a single attribute swap
    // is enough to switch the full palette.
    function applyTheme(theme) {
      var t = (typeof theme === "string" && theme.toLowerCase().indexOf("dark") !== -1)
              ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    }

    // 1. Check the SAP Fiori launchpad context object if it exists.
    //    FSA sets window.sap.ushell.Container.getService("UserInfo")
    //    or exposes the theme name on the renderer config.
    (function readFSAContext() {
      try {
        var sap = window.sap;
        // Path used by SAP Fiori launchpad / FSA shell.
        var theme = sap &&
                    sap.ushell &&
                    sap.ushell.Container &&
                    sap.ushell.Container.getRenderer &&
                    sap.ushell.Container.getRenderer("fiori2") &&
                    sap.ushell.Container.getRenderer("fiori2").getConfig &&
                    sap.ushell.Container.getRenderer("fiori2").getConfig().theme;
        if (theme) { applyTheme(theme); return; }

        // Fallback: FSA may set the theme on <html> itself.
        var htmlTheme = document.documentElement.getAttribute("data-sap-theme") ||
                        document.documentElement.className;
        if (htmlTheme) { applyTheme(htmlTheme); }
      } catch (e) { /* context not available — keep default */ }
    }());

    // 2. Listen for postMessage events from the FSA shell.
    //    FSA sends { type: "theme", value: "sap_horizon_dark" } (or similar)
    //    when the user switches themes at runtime.
    window.addEventListener("message", function (evt) {
      if (!evt.data || evt.data.type !== "theme") { return; }
      applyTheme(evt.data.value || evt.data.theme || "");
    });

    // 3. Watch for the data-sap-theme attribute changing on <html>
    //    (some FSA versions update it directly without postMessage).
    if (window.MutationObserver) {
      new MutationObserver(function (mutations) {
        mutations.forEach(function (m) {
          if (m.attributeName === "data-sap-theme" ||
              m.attributeName === "class") {
            applyTheme(document.documentElement.getAttribute("data-sap-theme") ||
                       document.documentElement.className);
          }
        });
      }).observe(document.documentElement, { attributes: true });
    }

    // ============================================================
    //  HOW THIS PAGE KNOWS IF YOU ARE ONLINE OR OFFLINE
    //  No servers, no downloads — the browser already tracks the
    //  device's network state and simply tells us. We just listen.
    // ============================================================

    // navigator.connection is the "Network Information" object the
    // browser keeps about the current connection (wifi/4g, speed…).
    // Some browsers do not provide it, so it may be undefined.
    var conn = navigator.connection;

    // The pieces of network info we want to show on screen. Each one
    // is a tiny function so we can re-read the *latest* value whenever
    // the connection changes. "conn && ..." avoids errors when the
    // browser does not support navigator.connection.
    var fields = {
      "navigator.onLine": function () { return navigator.onLine; },   // true = has a network
      "Connection type":  function () { return conn && conn.type; },      // wifi, cellular…
      "Effective type":   function () { return conn && conn.effectiveType; }, // 4g, 3g, 2g…
      "Downlink (Mbps)":  function () { return conn && conn.downlink; },   // estimated speed
      "RTT (ms)":         function () { return conn && conn.rtt; },        // round-trip delay
      "Data Saver":       function () { return conn && conn.saveData; }    // user asked to save data
    };

    // Redraws the screen. Called once at start, then again every time
    // the browser reports a network change. "reason" is just a label
    // for the log so we can see WHAT triggered the redraw.
    function update(reason) {
      // navigator.onLine is the simple yes/no: is there a network now?
      var online = navigator.onLine;
      var s = document.getElementById("status");
      s.className = online ? "online" : "offline";       // green vs red styling
      s.textContent = (online ? "ONLINE" : "OFFLINE") + " — " + new Date().toLocaleTimeString();

      // Build the detail table by reading each field's current value.
      document.getElementById("detail").innerHTML = Object.keys(fields).map(function (k) {
        var v = fields[k]();
        return "<div class='row'><span>" + k + "</span><span>" +
               (v == null ? "n/a" : v) + "</span></div>";   // "n/a" = browser did not tell us
      }).join("");

      // Add a timestamped line to the log so changes are visible over time.
      document.getElementById("log").textContent =
        new Date().toLocaleTimeString() + "  " + reason + "\n" +
        document.getElementById("log").textContent;
    }

    // THE ACTUAL DETECTION: the browser fires these events by itself
    // the instant the network state flips. We do not poll or guess —
    // we just react when it tells us.
    addEventListener("online",  function () { update("online event"); });   // network came back
    addEventListener("offline", function () { update("offline event"); });  // network was lost
    // Fires when the connection *quality* changes (e.g. wifi -> 4g),
    // even while still online. Only if the browser supports it.
    if (conn) conn.addEventListener("change", function () { update("connection change"); });

    // Draw once on load so the page shows the current state immediately.
    update("initial load");

    // "Copy Source Code": read this page's own HTML into memory, then copy
    // it to the clipboard on tap. Nothing is shown on screen.
    var copyBtn = document.getElementById("copy-btn");
    var rawSource = "";
    fetch(location.href).then(function (r) { return r.text(); })
      .then(function (t) { rawSource = t; })
      .catch(function () { rawSource = ""; });

    copyBtn.addEventListener("click", function () {
      var done = function (ok) { copyBtn.textContent = ok ? "Copied!" : "Copy failed";
        setTimeout(function () { copyBtn.textContent = "Copy Source Code"; }, 2000); };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(rawSource).then(function () { done(true); }, function () { done(false); });
      } else {
        // Fallback for browsers/WebViews without the clipboard API.
        var ta = document.createElement("textarea");
        ta.value = rawSource; document.body.appendChild(ta); ta.select();
        done(document.execCommand && document.execCommand("copy"));
        ta.remove();
      }
    });
  </script>

  <style>
    /* ── light theme (default) ── */
    :root, [data-theme="light"] {
      --bg:          #f5f5f5;
      --fg:          #1a1a1a;
      --online-col:  #1a7f37;
      --offline-col: #cf222e;
      --border-col:  #d0d7de;
      --panel-bg:    #ffffff;
      --btn-bg:      #0e639c;
      --btn-hover:   #1177bb;
    }

    /* ── dark theme — matches SAP Horizon Dark palette ── */
    [data-theme="dark"] {
      --bg:          #1c1c1c;
      --fg:          #c8d3db;
      --online-col:  #3fb950;
      --offline-col: #ff7b72;
      --border-col:  #3d444d;
      --panel-bg:    #262626;
      --btn-bg:      #1f6feb;
      --btn-hover:   #388bfd;
    }

    body { font-family: monospace; background: var(--bg); color: var(--fg);
           text-align: center; padding: 24px;
           transition: background 0.2s, color 0.2s; }
    #status { font-size: 34px; font-weight: 700; padding: 24px;
              border: 2px solid; border-radius: 8px; margin-bottom: 20px; }
    .online  { color: var(--online-col);  border-color: var(--online-col); }
    .offline { color: var(--offline-col); border-color: var(--offline-col); }
    #detail, #log { max-width: 480px; margin: 0 auto; text-align: left;
                    border: 1px solid var(--border-col); border-radius: 6px;
                    padding: 12px; background: var(--panel-bg); }
    #log { margin-top: 16px; font-size: 12px; white-space: pre-wrap; }
    .row { display: flex; justify-content: space-between; padding: 4px 0; }
    #copy-btn { margin: 16px auto 0; display: block; background: var(--btn-bg);
                color: #fff; border: none; border-radius: 6px; padding: 10px 16px;
                font-family: monospace; font-size: 14px; cursor: pointer; }
    #copy-btn:hover { background: var(--btn-hover); }
    #version { margin-top: 24px; font-size: 11px; opacity: 0.45; }
  </style>
</body>
</html>
