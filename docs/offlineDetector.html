<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connectivity Detector</title>
</head>
<body>
  <div id="status">CHECKING…</div>
  <button id="copy-btn">Copy Source Code</button>

  <script>
    // Is the device online? The browser already knows — we just read it
    // and listen for the moment it flips.
    function update() {
      var online = navigator.onLine;
      var s = document.getElementById("status");
      s.className = online ? "online" : "offline";
      s.textContent = (online ? "ONLINE" : "OFFLINE") + " — " + new Date().toLocaleTimeString();
    }

    // The browser fires these by itself the instant the network changes.
    addEventListener("online", update);
    addEventListener("offline", update);
    update();

    // Copy this page's own HTML to the clipboard.
    document.getElementById("copy-btn").addEventListener("click", function () {
      fetch(location.href).then(function (r) { return r.text(); })
        .then(function (t) { return navigator.clipboard.writeText(t); })
        .then(function () { flash("Copied!"); }, function () { flash("Copy failed"); });
    });
    function flash(msg) {
      var b = document.getElementById("copy-btn");
      b.textContent = msg;
      setTimeout(function () { b.textContent = "Copy Source Code"; }, 2000);
    }
  </script>

  <style>
    body { font-family: monospace; background: #000; color: #9dffa2;
           text-align: center; padding: 24px; }
    #status { font-size: 34px; font-weight: 700; padding: 24px;
              border: 2px solid; border-radius: 8px; margin-bottom: 20px; }
    .online  { color: #0f0;    border-color: #0f0;    text-shadow: 0 0 10px #0f0; }
    .offline { color: #ff4d4d; border-color: #ff4d4d; text-shadow: 0 0 10px #ff4d4d; }
    #copy-btn { background: #0e639c; color: #fff; border: none; border-radius: 6px;
                padding: 10px 16px; font-family: monospace; font-size: 14px; cursor: pointer; }
    #copy-btn:hover { background: #1177bb; }
  </style>
</body>
</html>
