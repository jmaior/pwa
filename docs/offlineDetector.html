<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connectivity Detector</title>
  <meta name="version" content="1.5.1" />
</head>
<body>
  <div id="status">CHECKING…</div>
  <div id="detail"></div>
  <div id="log"></div>

  <button id="copy-btn">Copy Source Code</button>
  <button id="refresh-btn">Refresh</button>
  <div id="theme-switcher">
    <button class="theme-btn" data-mode="device" title="Follow device setting">Device</button>
    <button class="theme-btn" data-mode="light"  title="Force light theme">Light</button>
    <button class="theme-btn" data-mode="dark"   title="Force dark theme">Dark</button>
  </div>
  <div id="version">v1.5.1</div>

  <details id="debug-panel">
    <summary>Debug log</summary>
    <div id="debug-log"></div>
    <button id="copy-debug-btn">Copy Debug Log</button>
    <button id="clear-debug-btn">Clear</button>
  </details>

  <script>
    // ============================================================
    //  DEBUG LOG
    // ============================================================
    var debugLines = [];
    function dbg(source, msg) {
      var line = new Date().toISOString() + "  [" + source + "]  " + msg;
      debugLines.unshift(line);
      var el = document.getElementById("debug-log");
      if (el) { el.textContent = debugLines.join("\n"); }
    }

    // ============================================================
    //  THEME
    //  Source: prefers-color-scheme (OS/browser setting).
    //  "device" mode tracks it live. "light"/"dark" override it.
    // ============================================================
    var themeMode = "device";

    function deviceTheme() {
      return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)
             ? "dark" : "light";
    }

    function applyTheme(theme, source) {
      var t = (typeof theme === "string" && theme.toLowerCase().indexOf("dark") !== -1)
              ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
      dbg("applyTheme", "data-theme=" + t + "  source=" + source);
    }

    function setMode(mode) {
      themeMode = mode;
      var btns = document.querySelectorAll(".theme-btn");
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle("active", btns[i].getAttribute("data-mode") === mode);
      }
      if (mode === "device") {
        var dt = deviceTheme();
        dbg("setMode", "mode=device  prefers-color-scheme=" + dt +
            "  mediaQuery=(prefers-color-scheme: dark) matches=" +
            (window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)").matches : "unsupported"));
        applyTheme(dt, "prefers-color-scheme");
      } else {
        dbg("setMode", "mode=" + mode + " (manual override)");
        applyTheme(mode, "manual");
      }
    }

    // Track OS theme changes live when in device mode.
    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (e) {
        var t = e.matches ? "dark" : "light";
        dbg("prefers-color-scheme", "OS setting changed to " + t + "  themeMode=" + themeMode);
        if (themeMode === "device") { applyTheme(t, "prefers-color-scheme change event"); }
      });
    }

    // ============================================================
    //  HOW THIS PAGE KNOWS IF YOU ARE ONLINE OR OFFLINE
    //  No servers, no downloads — the browser already tracks the
    //  device's network state and simply tells us. We just listen.
    // ============================================================

    var conn = navigator.connection;

    var fields = {
      "navigator.onLine": function () { return navigator.onLine; },
      "Connection type":  function () { return conn && conn.type; },
      "Effective type":   function () { return conn && conn.effectiveType; },
      "Downlink (Mbps)":  function () { return conn && conn.downlink; },
      "RTT (ms)":         function () { return conn && conn.rtt; },
      "Data Saver":       function () { return conn && conn.saveData; }
    };

    function update(reason) {
      var online = navigator.onLine;
      var s = document.getElementById("status");
      s.className = online ? "online" : "offline";
      s.textContent = (online ? "ONLINE" : "OFFLINE") + " — " + new Date().toLocaleTimeString();

      document.getElementById("detail").innerHTML = Object.keys(fields).map(function (k) {
        var v = fields[k]();
        return "<div class='row'><span>" + k + "</span><span>" +
               (v == null ? "n/a" : v) + "</span></div>";
      }).join("");

      document.getElementById("log").textContent =
        new Date().toLocaleTimeString() + "  " + reason + "\n" +
        document.getElementById("log").textContent;
    }

    addEventListener("online",  function () { update("online event"); });
    addEventListener("offline", function () { update("offline event"); });
    if (conn) conn.addEventListener("change", function () { update("connection change"); });

    update("initial load");

    // Copy Source Code button.
    var copyBtn = document.getElementById("copy-btn");
    var rawSource = "";
    fetch(location.href).then(function (r) { return r.text(); })
      .then(function (t) { rawSource = t; })
      .catch(function () { rawSource = ""; });

    copyBtn.addEventListener("click", function () {
      var done = function (ok) {
        copyBtn.textContent = ok ? "Copied!" : "Copy failed";
        setTimeout(function () { copyBtn.textContent = "Copy Source Code"; }, 2000);
      };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(rawSource).then(function () { done(true); }, function () { done(false); });
      } else {
        var ta = document.createElement("textarea");
        ta.value = rawSource; document.body.appendChild(ta); ta.select();
        done(document.execCommand && document.execCommand("copy"));
        ta.remove();
      }
    });

    // Refresh — bypass cache so the latest version always loads.
    document.getElementById("refresh-btn").addEventListener("click", function () {
      location.reload(true);
    });
    document.addEventListener("DOMContentLoaded", function () {
      var btns = document.querySelectorAll(".theme-btn");
      for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener("click", function () {
          setMode(this.getAttribute("data-mode"));
        });
      }

      dbg("init", "page loaded  userAgent=" + navigator.userAgent);
      dbg("init", "matchMedia supported=" + !!window.matchMedia +
          "  prefers-color-scheme=" + deviceTheme() +
          "  (prefers-color-scheme: dark) matches=" +
          (window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)").matches : "unsupported"));
      setMode("device");

      document.getElementById("copy-debug-btn").addEventListener("click", function () {
        var text = "=== Connectivity Detector debug log ===\n" + debugLines.join("\n");
        var btn = this;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text)
            .then(function () { btn.textContent = "Copied!"; setTimeout(function () { btn.textContent = "Copy Debug Log"; }, 2000); })
            .catch(function () { btn.textContent = "Copy failed"; setTimeout(function () { btn.textContent = "Copy Debug Log"; }, 2000); });
        } else {
          var ta = document.createElement("textarea");
          ta.value = text; document.body.appendChild(ta); ta.select();
          var ok = document.execCommand && document.execCommand("copy");
          ta.remove();
          btn.textContent = ok ? "Copied!" : "Copy failed";
          setTimeout(function () { btn.textContent = "Copy Debug Log"; }, 2000);
        }
      });

      document.getElementById("clear-debug-btn").addEventListener("click", function () {
        debugLines = [];
        document.getElementById("debug-log").textContent = "";
        dbg("init", "log cleared");
      });
    });
  </script>

  <style>
    /* ── light theme (default) ── */
    :root, [data-theme="light"] {
      --bg:          #f5f5f5;
      --fg:          #1a1a1a;
      --online-col:  #1a7f37;
      --offline-col: #cf222e;
      --border-col:  #d0d7de;
      --panel-bg:    #ffffff;
      --btn-bg:      #0e639c;
      --btn-hover:   #1177bb;
    }

    /* ── dark theme — matches SAP Horizon Dark palette ── */
    [data-theme="dark"] {
      --bg:          #1c1c1c;
      --fg:          #c8d3db;
      --online-col:  #3fb950;
      --offline-col: #ff7b72;
      --border-col:  #3d444d;
      --panel-bg:    #262626;
      --btn-bg:      #1f6feb;
      --btn-hover:   #388bfd;
    }

    body { font-family: monospace; background: var(--bg); color: var(--fg);
           text-align: center; padding: 24px;
           transition: background 0.2s, color 0.2s; }
    #status { font-size: 34px; font-weight: 700; padding: 24px;
              border: 2px solid; border-radius: 8px; margin-bottom: 20px; }
    .online  { color: var(--online-col);  border-color: var(--online-col); }
    .offline { color: var(--offline-col); border-color: var(--offline-col); }
    #detail, #log { max-width: 480px; margin: 0 auto; text-align: left;
                    border: 1px solid var(--border-col); border-radius: 6px;
                    padding: 12px; background: var(--panel-bg); }
    #log { margin-top: 16px; font-size: 12px; white-space: pre-wrap; }
    .row { display: flex; justify-content: space-between; padding: 4px 0; }
    #copy-btn { margin: 16px auto 0; display: block; background: var(--btn-bg);
                color: #fff; border: none; border-radius: 6px; padding: 10px 16px;
                font-family: monospace; font-size: 14px; cursor: pointer; }
    #copy-btn:hover { background: var(--btn-hover); }
    #refresh-btn { margin: 8px auto 0; display: block; background: transparent;
                   color: var(--fg); border: 1px solid var(--border-col);
                   border-radius: 6px; padding: 10px 16px;
                   font-family: monospace; font-size: 14px; cursor: pointer; }
    #refresh-btn:hover { border-color: var(--btn-bg); }
    #theme-switcher { margin: 12px auto 0; display: flex; justify-content: center; gap: 6px; }
    .theme-btn { background: transparent; color: var(--fg); border: 1px solid var(--border-col);
                 border-radius: 6px; padding: 6px 14px; font-family: monospace; font-size: 13px;
                 cursor: pointer; transition: background 0.15s, border-color 0.15s; }
    .theme-btn:hover { border-color: var(--btn-bg); }
    .theme-btn.active { background: var(--btn-bg); color: #fff; border-color: var(--btn-bg); }
    #version { margin-top: 24px; font-size: 11px; opacity: 0.45; }
    #debug-panel { max-width: 480px; margin: 20px auto 0; text-align: left;
                   border: 1px solid var(--border-col); border-radius: 6px;
                   padding: 10px 12px; background: var(--panel-bg); }
    #debug-panel summary { cursor: pointer; font-size: 12px; opacity: 0.7;
                           user-select: none; }
    #debug-log { margin-top: 8px; font-size: 11px; white-space: pre-wrap;
                 max-height: 220px; overflow-y: auto; word-break: break-all; }
    #copy-debug-btn, #clear-debug-btn { margin-top: 8px; margin-right: 6px;
                background: var(--btn-bg); color: #fff; border: none;
                border-radius: 6px; padding: 6px 12px; font-family: monospace;
                font-size: 12px; cursor: pointer; }
    #copy-debug-btn:hover, #clear-debug-btn:hover { background: var(--btn-hover); }
  </style>
</body>
</html>
