<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connectivity Detector</title>
  <style>
    body { font-family: monospace; background: #000; color: #9dffa2;
           text-align: center; padding: 24px; }
    #status { font-size: 34px; font-weight: 700; padding: 24px;
              border: 2px solid; border-radius: 8px; margin-bottom: 20px; }
    .online  { color: #0f0;    border-color: #0f0;    text-shadow: 0 0 10px #0f0; }
    .offline { color: #ff4d4d; border-color: #ff4d4d; text-shadow: 0 0 10px #ff4d4d; }
    #detail, #log { max-width: 480px; margin: 0 auto; text-align: left;
                    border: 1px solid #0f0; border-radius: 6px; padding: 12px; }
    #log { margin-top: 16px; font-size: 12px; white-space: pre-wrap; }
    .row { display: flex; justify-content: space-between; padding: 4px 0; }
    /* VS Code (Dark+) source viewer */
    #editor { max-width: 640px; margin: 16px auto 0; text-align: left;
              border: 1px solid #333; border-radius: 8px; overflow: hidden;
              box-shadow: 0 8px 24px rgba(0,0,0,0.6);
              font-family: "SF Mono", "Consolas", "Menlo", monospace; }
    #editor-titlebar { display: flex; align-items: center; gap: 8px;
                       background: #323233; padding: 8px 12px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.r { background: #ff5f56; } .dot.y { background: #ffbd2e; } .dot.g { background: #27c93f; }
    #editor-tab { margin-left: 8px; background: #1e1e1e; color: #d4d4d4;
                  font-size: 12px; padding: 4px 12px; border-radius: 4px 4px 0 0; }
    #editor-tab .lang { color: #e44d26; margin-right: 6px; }
    #copy-btn { margin-left: auto; background: #0e639c; color: #fff; border: none;
                border-radius: 4px; padding: 5px 12px; font: inherit; font-size: 12px;
                cursor: pointer; }
    #copy-btn:hover { background: #1177bb; }
    #editor-body { display: flex; background: #1e1e1e; max-height: 340px;
                   overflow: auto; font-size: 12px; line-height: 1.5; }
    #gutter { flex: none; text-align: right; color: #858585; background: #1e1e1e;
              padding: 12px 10px 12px 14px; user-select: none; white-space: pre; }
    #code { flex: 1; margin: 0; padding: 12px 16px; color: #d4d4d4;
            white-space: pre; tab-size: 2; }
    /* Dark+ token colors */
    .t-tag  { color: #569cd6; } .t-name { color: #4ec9b0; }
    .t-attr { color: #9cdcfe; } .t-str  { color: #ce9178; }
    .t-com  { color: #6a9955; } .t-punc { color: #808080; }
  </style>
</head>
<body>
  <div id="status">CHECKING…</div>
  <div id="detail"></div>
  <div id="log"></div>

  <div id="editor">
    <div id="editor-titlebar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span id="editor-tab"><span class="lang">&lt;/&gt;</span>offlineDetector.html</span>
      <button id="copy-btn">Copy Source Code</button>
    </div>
    <div id="editor-body">
      <div id="gutter"></div>
      <pre id="code"></pre>
    </div>
  </div>

  <script>
    // ============================================================
    //  HOW THIS PAGE KNOWS IF YOU ARE ONLINE OR OFFLINE
    //  No servers, no downloads — the browser already tracks the
    //  device's network state and simply tells us. We just listen.
    // ============================================================

    // navigator.connection is the "Network Information" object the
    // browser keeps about the current connection (wifi/4g, speed…).
    // Some browsers do not provide it, so it may be undefined.
    var conn = navigator.connection;

    // The pieces of network info we want to show on screen. Each one
    // is a tiny function so we can re-read the *latest* value whenever
    // the connection changes. "conn && ..." avoids errors when the
    // browser does not support navigator.connection.
    var fields = {
      "navigator.onLine": function () { return navigator.onLine; },   // true = has a network
      "Connection type":  function () { return conn && conn.type; },      // wifi, cellular…
      "Effective type":   function () { return conn && conn.effectiveType; }, // 4g, 3g, 2g…
      "Downlink (Mbps)":  function () { return conn && conn.downlink; },   // estimated speed
      "RTT (ms)":         function () { return conn && conn.rtt; },        // round-trip delay
      "Data Saver":       function () { return conn && conn.saveData; }    // user asked to save data
    };

    // Redraws the screen. Called once at start, then again every time
    // the browser reports a network change. "reason" is just a label
    // for the log so we can see WHAT triggered the redraw.
    function update(reason) {
      // navigator.onLine is the simple yes/no: is there a network now?
      var online = navigator.onLine;
      var s = document.getElementById("status");
      s.className = online ? "online" : "offline";       // green vs red styling
      s.textContent = (online ? "ONLINE" : "OFFLINE") + " — " + new Date().toLocaleTimeString();

      // Build the detail table by reading each field's current value.
      document.getElementById("detail").innerHTML = Object.keys(fields).map(function (k) {
        var v = fields[k]();
        return "<div class='row'><span>" + k + "</span><span>" +
               (v == null ? "n/a" : v) + "</span></div>";   // "n/a" = browser did not tell us
      }).join("");

      // Add a timestamped line to the log so changes are visible over time.
      document.getElementById("log").textContent =
        new Date().toLocaleTimeString() + "  " + reason + "\n" +
        document.getElementById("log").textContent;
    }

    // THE ACTUAL DETECTION: the browser fires these events by itself
    // the instant the network state flips. We do not poll or guess —
    // we just react when it tells us.
    addEventListener("online",  function () { update("online event"); });   // network came back
    addEventListener("offline", function () { update("offline event"); });  // network was lost
    // Fires when the connection *quality* changes (e.g. wifi -> 4g),
    // even while still online. Only if the browser supports it.
    if (conn) conn.addEventListener("change", function () { update("connection change"); });

    // Draw once on load so the page shows the current state immediately.
    update("initial load");

    var codeEl = document.getElementById("code");
    var gutter = document.getElementById("gutter");
    var copyBtn = document.getElementById("copy-btn");
    var rawSource = "";

    function esc(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Minimal HTML highlighter: comments, tags (name + attrs + strings), text.
    function highlight(src) {
      var out = "", i = 0;
      while (i < src.length) {
        if (src.substr(i, 4) === "<!--") {
          var end = src.indexOf("-->", i);
          if (end === -1) end = src.length; else end += 3;
          out += "<span class='t-com'>" + esc(src.slice(i, end)) + "</span>";
          i = end;
        } else if (src[i] === "<") {
          var gt = src.indexOf(">", i);
          if (gt === -1) gt = src.length; else gt += 1;
          out += highlightTag(src.slice(i, gt));
          i = gt;
        } else {
          var next = src.indexOf("<", i);
          if (next === -1) next = src.length;
          out += esc(src.slice(i, next));
          i = next;
        }
      }
      return out;
    }

    function highlightTag(tag) {
      // tag includes the surrounding < and > (or just < for a truncated tail).
      var open = tag.charAt(0);
      var close = /[>]$/.test(tag) ? tag.charAt(tag.length - 1) : "";
      var inner = tag.slice(1, close ? -1 : undefined);

      // Split element name from the attribute list, then highlight each part
      // separately so the attribute regex never sees the spans we inject.
      var m = inner.match(/^(\/?)([\w!-]+)([\s\S]*)$/);
      var namePart, attrPart;
      if (m) {
        namePart = "<span class='t-tag'>" + esc(m[1]) + "</span>" +
                   "<span class='t-name'>" + esc(m[2]) + "</span>";
        attrPart = esc(m[3]).replace(/([\w-]+)(=)(&quot;[^&]*&quot;|'[^']*')/g,
          function (full, a, eq, v) {
            return "<span class='t-attr'>" + a + "</span>" + eq + "<span class='t-str'>" + v + "</span>";
          });
      } else {
        namePart = esc(inner);
        attrPart = "";
      }
      return "<span class='t-punc'>" + esc(open) + "</span>" + namePart + attrPart +
             (close ? "<span class='t-punc'>" + esc(close) + "</span>" : "");
    }

    function render(src) {
      rawSource = src;
      codeEl.innerHTML = highlight(src);
      var lines = src.split("\n").length;
      var g = "";
      for (var n = 1; n <= lines; n++) g += n + "\n";
      gutter.textContent = g;
    }

    fetch(location.href).then(function (r) { return r.text(); })
      .then(function (t) { render(t); })
      .catch(function () { render("Source unavailable."); });

    copyBtn.addEventListener("click", function () {
      var done = function (ok) { copyBtn.textContent = ok ? "Copied!" : "Copy failed";
        setTimeout(function () { copyBtn.textContent = "Copy Source Code"; }, 2000); };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(rawSource).then(function () { done(true); }, function () { done(false); });
      } else {
        var ta = document.createElement("textarea");
        ta.value = rawSource; document.body.appendChild(ta); ta.select();
        done(document.execCommand && document.execCommand("copy"));
        ta.remove();
      }
    });
  </script>
</body>
</html>
