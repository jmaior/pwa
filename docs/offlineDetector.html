<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connectivity Detector</title>
  <meta name="version" content="2.3.0" />
</head>
<body>
  <div id="status">CHECKING…</div>
  <div id="detail"></div>
  <div id="log"></div>

  <button id="copy-btn">Copy Source Code</button>
  <button id="refresh-btn">Refresh</button>
  <div id="theme-switcher">
    <button class="theme-btn" data-mode="app"   title="Use theme from app URL parameter">App</button>
    <button class="theme-btn" data-mode="light" title="Force light theme">Light</button>
    <button class="theme-btn" data-mode="dark"  title="Force dark theme">Dark</button>
  </div>
  <div id="version">v2.3.0</div>

  <details id="debug-panel">
    <summary>Debug log</summary>
    <div id="debug-log"></div>
    <button id="copy-debug-btn">Copy Debug Log</button>
    <button id="clear-debug-btn">Clear</button>
  </details>

  <script>
    // ── DEBUG LOG ────────────────────────────────────────────────
    var debugLines = [];
    function dbg(source, msg) {
      var line = new Date().toISOString() + "  [" + source + "]  " + msg;
      debugLines.unshift(line);
      var el = document.getElementById("debug-log");
      if (el) { el.textContent = debugLines.join("\n"); }
    }

    // ── THEME ────────────────────────────────────────────────────
    // FSA opens this page in an iOS WebView web container. The app can
    // supply the dark/light theme through many channels. We probe each
    // source in priority order and use the first one that gives a value.
    // The debug panel shows which source wins.
    var currentMode = "app";

    // Normalize any raw string to "dark" or "light" (or null if no signal).
    function normalizeTheme(raw) {
      if (raw == null) { return null; }
      var s = String(raw).toLowerCase();
      if (s.indexOf("dark") !== -1 || s === "1" || s === "true") { return "dark"; }
      if (s.indexOf("light") !== -1 || s === "0" || s === "false") { return "light"; }
      return null;
    }

    // Read a value from another window's DOM. Returns null if cross-origin.
    function safeFrameValue(win, fn) {
      try { return fn(win.document); } catch (e) { return null; }
    }

    // Each probe returns a theme string ("dark"/"light") or null.
    // The "name" is logged so you can see which source worked.
    var themeSources = [
      { name: "query ?theme", fn: function () {
          return new URLSearchParams(window.location.search).get("theme");
        } },
      { name: "query ?sap-theme", fn: function () {
          return new URLSearchParams(window.location.search).get("sap-theme");
        } },
      { name: "query ?appearance", fn: function () {
          return new URLSearchParams(window.location.search).get("appearance");
        } },
      { name: "query ?mode", fn: function () {
          return new URLSearchParams(window.location.search).get("mode");
        } },
      { name: "hash #theme", fn: function () {
          var m = window.location.hash.match(/theme=([^&]+)/i);
          return m ? m[1] : null;
        } },
      { name: "html[data-sap-theme]", fn: function () {
          return document.documentElement.getAttribute("data-sap-theme");
        } },
      { name: "html[data-theme]", fn: function () {
          return document.documentElement.getAttribute("data-theme");
        } },
      { name: "html.className", fn: function () {
          return document.documentElement.className;
        } },
      { name: "body.className", fn: function () {
          return document.body ? document.body.className : null;
        } },
      { name: "window.sap.theming (self)", fn: function () {
          try { return window.sap.ui.getCore().getConfiguration().getTheme(); }
          catch (e) { return null; }
        } },
      { name: "parent html[data-sap-theme]", fn: function () {
          if (window.self === window.top) { return null; }
          return safeFrameValue(window.parent, function (d) {
            return d.documentElement.getAttribute("data-sap-theme");
          });
        } },
      { name: "parent html.className", fn: function () {
          if (window.self === window.top) { return null; }
          return safeFrameValue(window.parent, function (d) {
            return d.documentElement.className;
          });
        } },
      { name: "localStorage theme", fn: function () {
          try { return window.localStorage.getItem("theme") ||
                       window.localStorage.getItem("sap-theme"); }
          catch (e) { return null; }
        } },
      { name: "sessionStorage theme", fn: function () {
          try { return window.sessionStorage.getItem("theme") ||
                       window.sessionStorage.getItem("sap-theme"); }
          catch (e) { return null; }
        } },
      { name: "prefers-color-scheme", fn: function () {
          if (!window.matchMedia) { return null; }
          if (window.matchMedia("(prefers-color-scheme: dark)").matches) { return "dark"; }
          if (window.matchMedia("(prefers-color-scheme: light)").matches) { return "light"; }
          return null;
        } }
    ];

    // Walk the sources in order. Log every probe. Return the first hit.
    function resolveAppTheme() {
      for (var i = 0; i < themeSources.length; i++) {
        var raw, theme;
        try { raw = themeSources[i].fn(); } catch (e) { raw = null; }
        theme = normalizeTheme(raw);
        dbg("theme-probe", themeSources[i].name +
            " → raw=" + (raw == null ? "n/a" : "\"" + raw + "\"") +
            "  theme=" + (theme || "none"));
        if (theme) {
          return { theme: theme, source: themeSources[i].name };
        }
      }
      return { theme: "light", source: "default (no source matched)" };
    }

    function applyTheme(t, source) {
      document.documentElement.setAttribute("data-theme", t);
      dbg("theme", "APPLIED data-theme=" + t + "  source=" + source);
    }

    function setMode(mode) {
      currentMode = mode;
      var btns = document.querySelectorAll(".theme-btn");
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle("active", btns[i].getAttribute("data-mode") === mode);
      }
      if (mode === "app") {
        var r = resolveAppTheme();
        dbg("theme", "WINNING SOURCE=" + r.source + "  theme=" + r.theme);
        applyTheme(r.theme, r.source);
      } else {
        applyTheme(mode, "manual override");
      }
    }

    // Apply app theme on load and log environment context.
    dbg("theme", "URL=" + window.location.href);
    dbg("theme", "userAgent=" + navigator.userAgent);
    dbg("theme", "inIframe=" + (window.self !== window.top));
    setMode("app");

    // Late signals: re-resolve while in App mode if the app sends the
    // theme after load, or the OS appearance changes.
    window.addEventListener("message", function (ev) {
      var t = normalizeTheme(ev && ev.data);
      if (t == null && ev && ev.data && typeof ev.data === "object") {
        t = normalizeTheme(ev.data.theme || ev.data.sapTheme || ev.data.appearance);
      }
      dbg("theme", "postMessage received: " + JSON.stringify(ev ? ev.data : null) +
          "  → " + (t || "no theme"));
      if (t && currentMode === "app") { applyTheme(t, "postMessage (late)"); }
    });

    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      var onMq = function (e) {
        dbg("theme", "prefers-color-scheme changed → " + (e.matches ? "dark" : "light"));
        if (currentMode === "app") { setMode("app"); }
      };
      if (mq.addEventListener) { mq.addEventListener("change", onMq); }
      else if (mq.addListener) { mq.addListener(onMq); }
    }

    try {
      var mo = new MutationObserver(function () {
        if (currentMode === "app") {
          var r = resolveAppTheme();
          if (document.documentElement.getAttribute("data-theme") !== r.theme) {
            dbg("theme", "MutationObserver re-resolve → " + r.source + "  theme=" + r.theme);
            applyTheme(r.theme, r.source + " (observed)");
          }
        }
      });
      mo.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["data-sap-theme", "data-theme", "class"]
      });
    } catch (e) {
      dbg("theme", "MutationObserver unsupported: " + e);
    }

    // ── CONNECTIVITY ─────────────────────────────────────────────
    var conn = navigator.connection;

    var fields = {
      "navigator.onLine": function () { return navigator.onLine; },
      "Connection type":  function () { return conn && conn.type; },
      "Effective type":   function () { return conn && conn.effectiveType; },
      "Downlink (Mbps)":  function () { return conn && conn.downlink; },
      "RTT (ms)":         function () { return conn && conn.rtt; },
      "Data Saver":       function () { return conn && conn.saveData; }
    };

    function update(reason) {
      var online = navigator.onLine;
      var s = document.getElementById("status");
      s.className = online ? "online" : "offline";
      s.textContent = (online ? "ONLINE" : "OFFLINE") + " — " + new Date().toLocaleTimeString();

      var detail = Object.keys(fields).map(function (k) {
        var v = fields[k]();
        return "<div class='row'><span>" + k + "</span><span>" +
               (v == null ? "n/a" : v) + "</span></div>";
      }).join("");
      document.getElementById("detail").innerHTML = detail;

      document.getElementById("log").textContent =
        new Date().toLocaleTimeString() + "  " + reason + "\n" +
        document.getElementById("log").textContent;

      dbg("connectivity", "event=\"" + reason + "\"  onLine=" + online +
          (conn ? ("  type=" + (conn.type || "n/a") +
                   "  effectiveType=" + (conn.effectiveType || "n/a") +
                   "  downlink=" + (conn.downlink != null ? conn.downlink : "n/a") +
                   "  rtt=" + (conn.rtt != null ? conn.rtt : "n/a")) : "  NetworkInformation=unsupported"));
    }

    addEventListener("online",  function () { update("online event"); });
    addEventListener("offline", function () { update("offline event"); });
    if (conn) conn.addEventListener("change", function () { update("connection change"); });

    update("initial load");

    // ── COPY SOURCE CODE ─────────────────────────────────────────
    var copyBtn = document.getElementById("copy-btn");
    var rawSource = "";
    fetch(location.href).then(function (r) { return r.text(); })
      .then(function (t) { rawSource = t; })
      .catch(function () { rawSource = ""; });

    copyBtn.addEventListener("click", function () {
      var done = function (ok) {
        copyBtn.textContent = ok ? "Copied!" : "Copy failed";
        setTimeout(function () { copyBtn.textContent = "Copy Source Code"; }, 2000);
      };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(rawSource).then(function () { done(true); }, function () { done(false); });
      } else {
        var ta = document.createElement("textarea");
        ta.value = rawSource; document.body.appendChild(ta); ta.select();
        done(document.execCommand && document.execCommand("copy"));
        ta.remove();
      }
    });

    // ── REFRESH ──────────────────────────────────────────────────
    document.getElementById("refresh-btn").addEventListener("click", function () {
      location.reload(true);
    });

    // ── THEME SWITCHER ───────────────────────────────────────────
    var btns = document.querySelectorAll(".theme-btn");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", function () {
        setMode(this.getAttribute("data-mode"));
      });
    }

    // ── DEBUG PANEL BUTTONS ──────────────────────────────────────
    document.getElementById("copy-debug-btn").addEventListener("click", function () {
      var text = "=== Connectivity Detector debug log ===\n" + debugLines.join("\n");
      var btn = this;
      var done = function (ok) {
        btn.textContent = ok ? "Copied!" : "Copy failed";
        setTimeout(function () { btn.textContent = "Copy Debug Log"; }, 2000);
      };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
      } else {
        var ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        done(document.execCommand && document.execCommand("copy"));
        ta.remove();
      }
    });

    document.getElementById("clear-debug-btn").addEventListener("click", function () {
      debugLines = [];
      document.getElementById("debug-log").textContent = "";
      dbg("debug", "log cleared");
    });
  </script>

  <style>
    :root, [data-theme="light"] {
      --bg:          #f5f5f5;
      --fg:          #1a1a1a;
      --online-col:  #1a7f37;
      --offline-col: #cf222e;
      --border-col:  #d0d7de;
      --panel-bg:    #ffffff;
      --btn-bg:      #0e639c;
      --btn-hover:   #1177bb;
    }

    [data-theme="dark"] {
      --bg:          #1c1c1c;
      --fg:          #c8d3db;
      --online-col:  #3fb950;
      --offline-col: #ff7b72;
      --border-col:  #3d444d;
      --panel-bg:    #262626;
      --btn-bg:      #1f6feb;
      --btn-hover:   #388bfd;
    }

    body { font-family: monospace; background: var(--bg); color: var(--fg);
           text-align: center; padding: 24px; }
    #status { font-size: 34px; font-weight: 700; padding: 24px;
              border: 2px solid; border-radius: 8px; margin-bottom: 20px; }
    .online  { color: var(--online-col);  border-color: var(--online-col); }
    .offline { color: var(--offline-col); border-color: var(--offline-col); }
    #detail, #log { max-width: 480px; margin: 0 auto; text-align: left;
                    border: 1px solid var(--border-col); border-radius: 6px;
                    padding: 12px; background: var(--panel-bg); }
    #log { margin-top: 16px; font-size: 12px; white-space: pre-wrap; }
    .row { display: flex; justify-content: space-between; padding: 4px 0; }
    #copy-btn { margin: 16px auto 0; display: block; background: var(--btn-bg);
                color: #fff; border: none; border-radius: 6px; padding: 10px 16px;
                font-family: monospace; font-size: 14px; cursor: pointer; }
    #copy-btn:hover { background: var(--btn-hover); }
    #refresh-btn { margin: 8px auto 0; display: block; background: transparent;
                   color: var(--fg); border: 1px solid var(--border-col);
                   border-radius: 6px; padding: 10px 16px;
                   font-family: monospace; font-size: 14px; cursor: pointer; }
    #refresh-btn:hover { border-color: var(--btn-bg); }
    #theme-switcher { margin: 12px auto 0; display: flex; justify-content: center; gap: 6px; }
    .theme-btn { background: transparent; color: var(--fg); border: 1px solid var(--border-col);
                 border-radius: 6px; padding: 6px 14px; font-family: monospace; font-size: 13px;
                 cursor: pointer; transition: background 0.15s, border-color 0.15s; }
    .theme-btn:hover { border-color: var(--btn-bg); }
    .theme-btn.active { background: var(--btn-bg); color: #fff; border-color: var(--btn-bg); }
    #version { margin-top: 24px; font-size: 11px; opacity: 0.45; }
    #debug-panel { max-width: 480px; margin: 20px auto 0; text-align: left;
                   border: 1px solid var(--border-col); border-radius: 6px;
                   padding: 10px 12px; background: var(--panel-bg); }
    #debug-panel summary { cursor: pointer; font-size: 12px; opacity: 0.7;
                           user-select: none; }
    #debug-log { margin-top: 8px; font-size: 11px; white-space: pre-wrap;
                 max-height: 220px; overflow-y: auto; word-break: break-all; }
    #copy-debug-btn, #clear-debug-btn { margin-top: 8px; margin-right: 6px;
                background: var(--btn-bg); color: #fff; border: none;
                border-radius: 6px; padding: 6px 12px; font-family: monospace;
                font-size: 12px; cursor: pointer; }
    #copy-debug-btn:hover, #clear-debug-btn:hover { background: var(--btn-hover); }
  </style>
</body>
</html>
