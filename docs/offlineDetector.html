<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connectivity Detector</title>
  <style>
    body { font-family: monospace; background: #000; color: #9dffa2;
           text-align: center; padding: 24px; }
    #status { font-size: 34px; font-weight: 700; padding: 24px;
              border: 2px solid; border-radius: 8px; margin-bottom: 20px; }
    .online  { color: #0f0;    border-color: #0f0;    text-shadow: 0 0 10px #0f0; }
    .offline { color: #ff4d4d; border-color: #ff4d4d; text-shadow: 0 0 10px #ff4d4d; }
    #detail, #log { max-width: 480px; margin: 0 auto; text-align: left;
                    border: 1px solid #0f0; border-radius: 6px; padding: 12px; }
    #log { margin-top: 16px; font-size: 12px; white-space: pre-wrap; }
    .row { display: flex; justify-content: space-between; padding: 4px 0; }
    #copy-btn { font-family: monospace; background: #001a00; color: #9dffa2;
                border: 1px solid #0f0; border-radius: 6px; padding: 10px 16px;
                margin: 16px auto 0; font-size: 14px; cursor: pointer; }
    #copy-btn:active { background: #004400; }
    #src { display: block; width: 100%; max-width: 480px; height: 160px;
           margin: 10px auto 0; background: #020; color: #9dffa2;
           border: 1px solid #0f0; border-radius: 6px; padding: 8px;
           font-family: monospace; font-size: 11px; }
  </style>
</head>
<body>
  <div id="status">CHECKING…</div>
  <div id="detail"></div>
  <div id="log"></div>

  <button id="copy-btn">Copy source</button>
  <textarea id="src" readonly></textarea>

  <script>
    var conn = navigator.connection;
    var fields = {
      "navigator.onLine": function () { return navigator.onLine; },
      "Connection type":  function () { return conn && conn.type; },
      "Effective type":   function () { return conn && conn.effectiveType; },
      "Downlink (Mbps)":  function () { return conn && conn.downlink; },
      "RTT (ms)":         function () { return conn && conn.rtt; },
      "Data Saver":       function () { return conn && conn.saveData; }
    };

    function update(reason) {
      var online = navigator.onLine;
      var s = document.getElementById("status");
      s.className = online ? "online" : "offline";
      s.textContent = (online ? "ONLINE" : "OFFLINE") + " — " + new Date().toLocaleTimeString();

      document.getElementById("detail").innerHTML = Object.keys(fields).map(function (k) {
        var v = fields[k]();
        return "<div class='row'><span>" + k + "</span><span>" +
               (v == null ? "n/a" : v) + "</span></div>";
      }).join("");

      document.getElementById("log").textContent =
        new Date().toLocaleTimeString() + "  " + reason + "\n" +
        document.getElementById("log").textContent;
    }

    addEventListener("online",  function () { update("online event"); });
    addEventListener("offline", function () { update("offline event"); });
    if (conn) conn.addEventListener("change", function () { update("connection change"); });

    update("initial load");

    var srcBox = document.getElementById("src");
    var copyBtn = document.getElementById("copy-btn");
    fetch(location.href).then(function (r) { return r.text(); })
      .then(function (t) { srcBox.value = t; })
      .catch(function () { srcBox.value = "Source unavailable — long-press this box to select."; });

    copyBtn.addEventListener("click", function () {
      srcBox.focus();
      srcBox.select();
      var done = function (ok) { copyBtn.textContent = ok ? "Copied!" : "Select text above, then copy";
        setTimeout(function () { copyBtn.textContent = "Copy source"; }, 2000); };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(srcBox.value).then(function () { done(true); }, function () { done(false); });
      } else {
        done(document.execCommand && document.execCommand("copy"));
      }
    });
  </script>
</body>
</html>
