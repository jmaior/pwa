<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>NFC Reader</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f4f4;
        color: #1a1a1a;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      header {
        background: #0070f2;
        color: #fff;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      header h1 { font-size: 18px; font-weight: 600; }

      .icon-nfc {
        width: 28px; height: 28px;
        fill: none; stroke: #fff; stroke-width: 2;
        stroke-linecap: round; stroke-linejoin: round;
        flex-shrink: 0;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 20px;
        gap: 24px;
      }

      /* Scan button area */
      .scan-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .pulse-ring {
        position: relative;
        width: 120px; height: 120px;
        display: flex; align-items: center; justify-content: center;
      }

      .pulse-ring::before,
      .pulse-ring::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        border: 2px solid #0070f2;
        opacity: 0;
        animation: none;
      }

      .pulse-ring.scanning::before {
        width: 100%; height: 100%;
        animation: pulse 1.6s ease-out infinite;
      }

      .pulse-ring.scanning::after {
        width: 80%; height: 80%;
        animation: pulse 1.6s ease-out 0.4s infinite;
      }

      @keyframes pulse {
        0%   { opacity: 0.6; transform: scale(0.8); }
        100% { opacity: 0;   transform: scale(1.4); }
      }

      .nfc-icon-large {
        width: 64px; height: 64px;
        fill: none; stroke: #0070f2; stroke-width: 1.8;
        stroke-linecap: round; stroke-linejoin: round;
        transition: stroke 0.2s;
        z-index: 1;
      }

      .nfc-icon-large.inactive { stroke: #aaa; }

      .status-text {
        font-size: 14px;
        color: #555;
        text-align: center;
        min-height: 20px;
      }

      .status-text.scanning { color: #0070f2; font-weight: 500; }
      .status-text.success  { color: #107e3e; font-weight: 500; }
      .status-text.error    { color: #bb0000; font-weight: 500; }

      /* Buttons */
      .btn {
        padding: 12px 32px;
        border-radius: 8px;
        border: none;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, opacity 0.15s;
        width: 200px;
      }

      .btn-primary   { background: #0070f2; color: #fff; }
      .btn-primary:active  { background: #0057c2; }
      .btn-secondary { background: #fff; color: #0070f2; border: 2px solid #0070f2; }
      .btn-secondary:active { background: #e8f2ff; }
      .btn:disabled  { opacity: 0.4; cursor: default; }

      /* Not supported banner */
      .banner {
        background: #ffebd6;
        border: 1px solid #e07b39;
        border-radius: 8px;
        padding: 14px 16px;
        font-size: 13px;
        color: #7a3b00;
        width: 100%;
        max-width: 480px;
        line-height: 1.5;
      }

      /* Results */
      .results {
        width: 100%;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .results-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .results-header h2 { font-size: 15px; font-weight: 600; color: #333; }

      .btn-clear {
        background: none;
        border: none;
        font-size: 13px;
        color: #0070f2;
        cursor: pointer;
        padding: 2px 4px;
      }

      .tag-card {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        overflow: hidden;
      }

      .tag-card-header {
        background: #0070f2;
        color: #fff;
        padding: 10px 14px;
        font-size: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .tag-card-header .serial {
        font-family: monospace;
        font-size: 11px;
        opacity: 0.85;
      }

      .tag-card-body { padding: 12px 14px; }

      .record-row {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 8px 0;
        border-bottom: 1px solid #f0f0f0;
      }

      .record-row:last-child { border-bottom: none; }

      .record-type {
        font-size: 11px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .record-value {
        font-size: 14px;
        color: #1a1a1a;
        word-break: break-all;
      }

      .no-records {
        font-size: 13px;
        color: #888;
        font-style: italic;
      }

      .timestamp {
        font-size: 11px;
        color: #aaa;
        text-align: right;
        margin-top: 6px;
      }

      .empty-state {
        text-align: center;
        color: #aaa;
        font-size: 14px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <svg class="icon-nfc" viewBox="0 0 24 24">
        <path d="M6 8.5A6.5 6.5 0 0 1 12 4"/>
        <path d="M18 8.5A6.5 6.5 0 0 0 12 4"/>
        <path d="M8.5 12a3.5 3.5 0 0 1 3.5-3.5"/>
        <path d="M15.5 12A3.5 3.5 0 0 0 12 8.5"/>
        <circle cx="12" cy="12" r="1"/>
        <path d="M6 15.5A6.5 6.5 0 0 0 12 20"/>
        <path d="M18 15.5A6.5 6.5 0 0 1 12 20"/>
      </svg>
      <h1>NFC Reader</h1>
    </header>

    <main>
      <div id="notSupported" class="banner" style="display:none">
        Web NFC is not available on this device or browser. Use Chrome on Android with an NFC-capable device.
      </div>

      <div class="scan-area">
        <div class="pulse-ring" id="pulseRing">
          <svg class="nfc-icon-large inactive" id="nfcIcon" viewBox="0 0 24 24">
            <path d="M4 6a9 9 0 0 1 9-3"/>
            <path d="M20 6a9 9 0 0 0-9-3"/>
            <path d="M7 11.5A5 5 0 0 1 12 8"/>
            <path d="M17 11.5A5 5 0 0 0 12 8"/>
            <circle cx="12" cy="12" r="1.5"/>
            <path d="M4 18a9 9 0 0 0 9 3"/>
            <path d="M20 18a9 9 0 0 1-9 3"/>
          </svg>
        </div>

        <p class="status-text" id="statusText">Ready to scan</p>

        <button class="btn btn-primary" id="btnScan">Start Scanning</button>
        <button class="btn btn-secondary" id="btnStop" style="display:none">Stop</button>
      </div>

      <div class="results" id="results" style="display:none">
        <div class="results-header">
          <h2>Scanned Tags</h2>
          <button class="btn-clear" id="btnClear">Clear</button>
        </div>
        <div id="tagList"></div>
      </div>

      <p class="empty-state" id="emptyState">No tags scanned yet.</p>
    </main>

    <script>
      const btnScan    = document.getElementById('btnScan');
      const btnStop    = document.getElementById('btnStop');
      const btnClear   = document.getElementById('btnClear');
      const statusText = document.getElementById('statusText');
      const pulseRing  = document.getElementById('pulseRing');
      const nfcIcon    = document.getElementById('nfcIcon');
      const results    = document.getElementById('results');
      const tagList    = document.getElementById('tagList');
      const emptyState = document.getElementById('emptyState');
      const notSupported = document.getElementById('notSupported');

      let ndef = null;
      let abortController = null;

      if (!('NDEFReader' in window)) {
        notSupported.style.display = 'block';
        btnScan.disabled = true;
        setStatus('Not supported on this device', 'error');
      }

      function setStatus(text, state = '') {
        statusText.textContent = text;
        statusText.className = 'status-text' + (state ? ' ' + state : '');
      }

      function setScanning(active) {
        pulseRing.classList.toggle('scanning', active);
        nfcIcon.classList.toggle('inactive', !active);
        btnScan.style.display = active ? 'none' : 'block';
        btnStop.style.display = active ? 'block' : 'none';
      }

      function decodeRecord(record) {
        try {
          if (record.recordType === 'text') {
            const decoder = new TextDecoder(record.encoding || 'utf-8');
            return decoder.decode(record.data);
          }
          if (record.recordType === 'url') {
            const decoder = new TextDecoder();
            return decoder.decode(record.data);
          }
          if (record.recordType === 'mime') {
            const decoder = new TextDecoder();
            return decoder.decode(record.data);
          }
          // Raw bytes for unknown types
          return Array.from(new Uint8Array(record.data))
            .map(b => b.toString(16).padStart(2, '0'))
            .join(' ');
        } catch {
          return '(unreadable)';
        }
      }

      function renderTag(serialNumber, records, timestamp) {
        const card = document.createElement('div');
        card.className = 'tag-card';

        const header = document.createElement('div');
        header.className = 'tag-card-header';
        header.innerHTML = `
          <span>NFC Tag</span>
          <span class="serial">${serialNumber || 'no serial'}</span>
        `;

        const body = document.createElement('div');
        body.className = 'tag-card-body';

        if (!records || records.length === 0) {
          body.innerHTML = '<p class="no-records">No NDEF records found on this tag.</p>';
        } else {
          records.forEach(record => {
            const row = document.createElement('div');
            row.className = 'record-row';
            row.innerHTML = `
              <span class="record-type">${record.recordType}${record.mediaType ? ' · ' + record.mediaType : ''}</span>
              <span class="record-value">${record.value}</span>
            `;
            body.appendChild(row);
          });
        }

        const ts = document.createElement('p');
        ts.className = 'timestamp';
        ts.textContent = timestamp;
        body.appendChild(ts);

        card.appendChild(header);
        card.appendChild(body);

        tagList.prepend(card);
        results.style.display = 'flex';
        emptyState.style.display = 'none';
      }

      async function startScan() {
        try {
          ndef = new NDEFReader();
          abortController = new AbortController();

          await ndef.scan({ signal: abortController.signal });

          setScanning(true);
          setStatus('Hold an NFC tag near the device', 'scanning');

          ndef.addEventListener('reading', ({ serialNumber, message }) => {
            const records = message.records.map(record => ({
              recordType: record.recordType,
              mediaType: record.mediaType,
              value: decodeRecord(record)
            }));

            const timestamp = new Date().toLocaleTimeString();
            renderTag(serialNumber, records, timestamp);
            setStatus('Tag read successfully', 'success');

            setTimeout(() => {
              if (abortController && !abortController.signal.aborted) {
                setStatus('Hold an NFC tag near the device', 'scanning');
              }
            }, 2000);
          });

          ndef.addEventListener('readingerror', () => {
            setStatus('Could not read tag. Try again.', 'error');
            setTimeout(() => setStatus('Hold an NFC tag near the device', 'scanning'), 2000);
          });

          abortController.signal.addEventListener('abort', () => {
            setScanning(false);
            setStatus('Scanning stopped');
            ndef = null;
            abortController = null;
          });

        } catch (err) {
          setScanning(false);
          if (err.name === 'NotAllowedError') {
            setStatus('NFC permission denied', 'error');
          } else if (err.name === 'NotSupportedError') {
            setStatus('NFC not supported on this device', 'error');
          } else {
            setStatus('Error: ' + err.message, 'error');
          }
          ndef = null;
          abortController = null;
        }
      }

      function stopScan() {
        if (abortController) {
          abortController.abort();
        }
      }

      function clearResults() {
        tagList.innerHTML = '';
        results.style.display = 'none';
        emptyState.style.display = 'block';
      }

      btnScan.addEventListener('click', startScan);
      btnStop.addEventListener('click', stopScan);
      btnClear.addEventListener('click', clearResults);

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
      }
    </script>
  </body>
</html>
