<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Test Report</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
    onload="window._jspdfLoaded=true"
    onerror="window._jspdfLoadError='jsPDF CDN failed to load'"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"
    onload="window._autotableLoaded=true"
    onerror="window._autotableLoadError='autoTable CDN failed to load'"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
    onload="window._pdfjsLoaded=true;pdfjsLib.GlobalWorkerOptions.workerSrc='';"
    onerror="window._pdfjsLoadError='PDF.js CDN failed to load'"></script>
  <style>
    :root {
      --bar: #354a5f;
      --accent: #0070b8;
      --bg: #f2f2f2;
      --card: #fff;
      --label: #6b6b6b;
      --divider: rgba(0,0,0,0.08);
      --red-border: #c23934;
      --yellow-bg: #fff9c4;
      --tol-bg: #e8eaf0;
      --result-ok: #2e844a;
      --result-fail: #c23934;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    /* ── Top bar ── */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bar);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      padding-top: calc(10px + env(safe-area-inset-top));
    }
    .top-bar .title { font-size: 15px; font-weight: 700; letter-spacing: .3px; }
    .top-bar .ref { font-size: 11px; opacity: .75; text-align: right; line-height: 1.4; }

    /* ── Update banner ── */
    .update-banner {
      display: none;
      position: sticky;
      top: 0;
      z-index: 11;
      background: #e65c00;
      color: #fff;
      font-size: 13px;
      padding: 9px 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .update-banner.show { display: flex; }
    .update-banner button {
      border: none;
      background: #fff;
      color: #e65c00;
      font-weight: 700;
      font-size: 12px;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* ── Report heading ── */
    .report-heading {
      background: #fff;
      border-bottom: 2px solid #222;
      padding: 12px 16px 10px;
    }
    .report-heading .en { font-size: 15px; font-weight: 700; }
    .report-heading .sub-en { font-size: 13px; font-weight: 600; margin-top: 8px; }
    .report-heading .tr-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-top: 2px solid #222;
      margin-top: 10px;
      padding-top: 6px;
      gap: 8px;
    }
    .report-heading .tr-label { font-size: 13px; font-weight: 700; }
    .report-heading .tr-label span { font-weight: 400; font-size: 12px; color: #555; }
    .report-heading .tr-code { font-size: 15px; font-weight: 700; }
    .report-heading .tr-ref { font-size: 12px; color: #444; text-align: right; }

    /* ── Page layout ── */
    .page {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 0 80px;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border-radius: 0;
      box-shadow: 0 1px 0 var(--divider);
      padding: 0 16px;
      margin-bottom: 8px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--label);
      padding: 10px 0 6px;
      border-bottom: 1px solid var(--divider);
    }

    /* ── Two-column header grid ── */
    .header-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 16px;
    }
    @media (max-width: 500px) {
      .header-grid { grid-template-columns: 1fr; }
    }
    .field {
      padding: 9px 0;
      border-bottom: 1px solid var(--divider);
    }
    .field:last-child { border-bottom: none; }
    .lbl {
      font-size: 11px;
      color: var(--label);
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .field-value-lbl {
      font-size: 14px;
      padding: 5px 2px;
      color: var(--fg, #1a1a1a);
      min-height: 28px;
    }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      font-size: 14px;
      padding: 5px 7px;
      border: 1px solid #c8c8c8;
      border-radius: 4px;
      background: #eef2fb;
      color: #1a1a1a;
      appearance: none;
      -webkit-appearance: none;
    }
    input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }
    .inline-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .inline-row input, .inline-row select { flex: 1; }
    .unit-label { font-size: 13px; font-weight: 600; white-space: nowrap; }

    /* ── Conditions bar ── */
    .conditions-card {
      background: var(--card);
      box-shadow: 0 1px 0 var(--divider);
      padding: 10px 16px;
      margin-bottom: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      align-items: flex-end;
    }
    .cond-group { display: flex; flex-direction: column; gap: 4px; }
    .cond-group .lbl { margin-bottom: 0; }
    .cond-group .inline-row input[type="number"] { width: 80px; }
    .red-border input { border-color: var(--red-border) !important; border-width: 2px !important; }
    .highlighted select { border-color: var(--red-border) !important; border-width: 2px !important; }
    .hide-sn-label {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--yellow-bg);
      border: 1px solid #e0c800;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .hide-sn-label input[type="checkbox"] {
      width: 16px; height: 16px;
      flex-shrink: 0;
      border: 1px solid #888;
      background: #fff;
      border-radius: 2px;
      appearance: auto;
      -webkit-appearance: auto;
    }

    /* ── Compartment cards ── */
    .comp-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 12px 8px;
    }
    .comp-card {
      background: var(--card);
      border: 1px solid #c8cdd8;
      border-radius: 8px;
      overflow: hidden;
    }
    .comp-card-header {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #e6e9ef;
      padding: 6px 8px;
      border-bottom: 1px solid #c8cdd8;
    }
    .comp-card-header input.comp-name-input {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      background: #fff;
      border: 1px solid #b0b8c8;
      border-radius: 4px;
      padding: 4px 6px;
    }
    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      font-size: 15px;
      font-weight: 700;
      background: #d0d4e0;
      border: 1px solid #aab;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }
    .ctrl-btn:active { background: #b0b8cc; }
    .comp-card-meta {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      padding: 6px 8px 4px;
      border-bottom: 1px solid #e0e3ea;
      flex-wrap: wrap;
    }
    .comp-card-meta .meta-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .comp-card-meta .meta-lbl {
      font-size: 10px;
      color: #666;
    }
    .comp-card-meta select, .comp-card-meta input[type="text"] {
      font-size: 12px;
      padding: 3px 5px;
      background: #eef2fb;
      border: 1px solid #b0b8c8;
      border-radius: 3px;
    }
    .sn-row { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 100px; }
    body.hide-serial .sn-row { display: none; }
    .comp-alarm-row {
      display: grid;
      grid-template-columns: 42px 1fr 1fr 1fr 1fr 1fr 80px;
      gap: 4px;
      align-items: center;
      padding: 5px 8px;
      border-top: 1px solid #e8eaef;
    }
    .comp-alarm-row:first-of-type { border-top: none; }
    .alarm-label {
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      color: #333;
    }
    @keyframes label-blink {
      0%   { background: #fff9c4; color: #b45309; }
      40%  { background: #fef08a; color: #92400e; }
      100% { background: transparent; color: #333; }
    }
    .alarm-label.blink { animation: label-blink 0.7s ease-out forwards; }
    @keyframes tol-blink {
      0%   { background: #bbf7d0; }
      40%  { background: #4ade80; }
      100% { background: var(--tol-bg); }
    }
    .tol.blink { animation: tol-blink 0.7s ease-out forwards; }
    .comp-alarm-row .fld {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .comp-alarm-row .fld-lbl {
      font-size: 9px;
      color: #777;
      white-space: nowrap;
    }
    .comp-alarm-row input[type="number"],
    .comp-alarm-row input[type="text"] {
      width: 100%;
      font-size: 12px;
      padding: 3px 4px;
      background: #eef2fb;
      border: 1px solid #b0b8c8;
      border-radius: 3px;
      min-width: 0;
    }
    .comp-alarm-row input.p20-val {
      background: #f0f0f0;
      color: #555;
    }
    .comp-alarm-row input.tol { background: var(--tol-bg); }
    .comp-alarm-row select {
      width: 100%;
      font-size: 12px;
      padding: 3px 4px;
      border: 1px solid #b0b8c8;
      border-radius: 3px;
      min-width: 0;
    }
    .alarm-row-ok  { background: #d4edda44; }
    .alarm-row-fail { background: #f8d7da66; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: .85; }
    .btn.secondary { background: #e0e4ea; color: #1a1a1a; }
    .btn.add-comp { background: #fff; border: 1px solid var(--accent); color: var(--accent); width: 100%; margin: 6px 0 4px; }

    /* ── Submit area ── */
    .submit-area {
      padding: 12px 16px;
      background: var(--card);
      box-shadow: 0 1px 0 var(--divider);
      margin-bottom: 8px;
    }
    .submit-area .btn { width: 100%; }

    .result-panel {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      background: #f0f8f0;
      border: 1px solid #9ec;
      border-radius: 6px;
      font-size: 11px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 260px;
      overflow-y: auto;
    }
    .result-panel.error { background: #fff0f0; border-color: #f9a; }
    .result-panel.show { display: block; }

    /* ── PDF modal ── */
    .pdf-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #000;
      flex-direction: column;
    }
    .pdf-overlay.show { display: flex; }
    .pdf-modal {
      background: #fff;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pdf-modal-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bar);
      color: #fff;
      flex-shrink: 0;
      gap: 8px;
    }
    .pdf-modal-title { font-size: 13px; font-weight: 600; flex: 1; }
    .pdf-modal-bar button {
      border: none; border-radius: 4px; padding: 5px 12px;
      font-size: 12px; cursor: pointer; white-space: nowrap;
    }
    .pdf-btn-dl    { background: #fff; color: var(--bar); font-weight: 600; }
    .pdf-btn-share { background: rgba(255,255,255,0.18); color: #fff; }
    .pdf-btn-close { background: rgba(255,255,255,0.18); color: #fff; }
    .pdf-viewer {
      flex: 1;
      overflow: auto;
      background: #525659;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .pdf-viewer canvas {
      display: block;
      margin: 0;
      max-width: 100%;
    }
    .pdf-pages { padding: 0; width: 100%; }

    /* ── Debug log ── */
    .dbg-wrap {
      margin: 8px 16px 16px;
      border-radius: 6px;
      overflow: hidden;
      font-size: 11px;
    }
    .dbg-head {
      display: flex;
      align-items: center;
      background: #2a2a2a;
      color: #ccc;
      padding: 6px 10px;
      cursor: pointer;
      user-select: none;
      gap: 8px;
    }
    .dbg-head .dbg-toggle { font-family: monospace; }
    .dbg-head .dbg-copy { margin-left: auto; font-size: 11px; color: #aaa; cursor: pointer; }
    .dbg-head .dbg-clear { margin-left: 10px; font-size: 11px; color: #aaa; cursor: pointer; }
    .dbg-head .dbg-refresh { margin-left: 10px; font-size: 11px; color: #aaa; cursor: pointer; }
    .dbg-body {
      background: #1a1a1a;
      color: #e0e0e0;
      max-height: 800px;
      overflow-y: auto;
      padding: 6px 10px;
      font-family: monospace;
    }
    .dbg-wrap.collapsed .dbg-body { display: none; }
    .dbg-entry { margin-bottom: 2px; line-height: 1.5; }
    .dbg-time { color: #666; margin-right: 6px; }
    .dbg-tag { padding: 1px 5px; border-radius: 3px; margin-right: 5px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .dbg-tag.info  { background: #1e3a5f; color: #7ec8e3; }
    .dbg-tag.send  { background: #0d3d2a; color: #5dd39e; }
    .dbg-tag.recv  { background: #3a2a00; color: #ffc94a; }
    .dbg-tag.warn  { background: #3a2a00; color: #ffc94a; }
    .dbg-tag.error { background: #4a1010; color: #f88; }
  </style>
</head>
<body>

  <div class="top-bar">
  </div>

  <div class="update-banner" id="updateBanner">
    <span id="updateBannerMsg">A new version is available.</span>
    <button id="updateBannerBtn">Reload</button>
  </div>

  <div class="page">

    <!-- Report heading -->
    <div class="report-heading">
      <div class="tr-row">
        <div>
          <span class="tr-label">Test report <span style="font-weight:400;font-size:11px;color:#888;" id="appVersionLabel"></span></span>
        </div>
      </div>
    </div>

    <!-- Header fields -->
    <div class="card" style="margin-top:8px;">
      <div class="header-grid">
        <!-- Left column -->
        <div>
          <div class="field">
            <div class="lbl">Equipment Name</div>
            <div id="h_bay" class="field-value-lbl"></div>
          </div>
          <div class="field">
            <div class="lbl">Serial number</div>
            <div id="h_serial" class="field-value-lbl"></div>
          </div>
          <div class="field" style="border-bottom:none;">
            <div class="lbl">Rated voltage</div>
            <div class="inline-row">
              <input type="number" id="h_voltage" inputmode="decimal" placeholder="0" min="0" step="0.1" />
              <span class="unit-label">kV</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Measurement conditions -->
    <div class="conditions-card">
      <div class="cond-group red-border">
        <div class="lbl">Above sea level</div>
        <div class="inline-row">
          <input type="number" id="c_altitude" inputmode="decimal" placeholder="0" min="0" />
          <select id="c_alt_unit" style="width:60px;">
            <option>m</option>
            <option>ft</option>
          </select>
          <button type="button" id="btn_geolocate" class="btn secondary" style="padding:4px 8px;font-size:12px;" title="Get altitude from device GPS">📍</button>
        </div>
        <div id="alt_status" style="font-size:11px;color:var(--label);margin-top:2px;"></div>
      </div>
      <div class="cond-group highlighted">
        <div class="lbl">Unit</div>
        <select id="c_unit" style="width:130px;">
          <option>bar (rel.)</option>
          <option>bar (abs.)</option>
          <option>MPa</option>
          <option>psi (rel.)</option>
        </select>
      </div>
      <div class="cond-group">
        <label class="hide-sn-label">
          Hide Serial Number
          <input type="checkbox" id="c_hide_sn" />
        </label>
      </div>
    </div>

    <!-- Compartments -->
    <div id="gasBody" class="comp-list"></div>

    <div style="padding: 0 16px 4px;">
      <button class="btn add-comp" id="btnAddComp">+ Add compartment</button>
    </div>

    <!-- Submit -->
    <div class="submit-area">
      <button class="btn" id="btnSubmit">Submit report</button>
      <div class="result-panel" id="resultPanel"></div>
    </div>

    <!-- PDF modal -->
    <div class="pdf-overlay" id="pdfOverlay">
      <div class="pdf-modal">
        <div class="pdf-modal-bar">
          <span class="pdf-modal-title">Test Report — TR 3004</span>
          <button class="pdf-btn-dl" id="pdfBtnDl">Download</button>
          <button class="pdf-btn-share" id="pdfBtnShare">Share</button>
          <button class="pdf-btn-close" id="pdfBtnClose">✕ Close</button>
        </div>
        <div class="pdf-viewer" id="pdfViewer">
          <div class="pdf-pages" id="pdfPages"></div>
        </div>
      </div>
    </div>

    <!-- Debug log -->
    <div class="dbg-wrap collapsed" id="dbgWrap">
      <div class="dbg-head" id="dbgHead">
        <span class="dbg-toggle">▶</span>
        <span>Debug log</span>
        <span class="dbg-copy" id="dbgCopy">Copy</span>
        <span class="dbg-clear" id="dbgClear">Clear</span>
        <span class="dbg-refresh" id="dbgRefresh">Refresh</span>
      </div>
      <div class="dbg-body" id="dbgBody"></div>
    </div>

  </div><!-- .page -->

  <script>
    const $ = id => document.getElementById(id);
    const APP_VERSION = "1.0.9";

    // ── Debug log ──────────────────────────────────────────────────────────────
    const dbg = (function () {
      const entries = [];
      function render() {
        const el = $("dbgBody");
        if (!el) return;
        el.innerHTML = entries.map(e =>
          `<div class="dbg-entry"><span class="dbg-time">${e.time}</span>` +
          `<span class="dbg-tag ${e.tag}">${e.tag}</span>${e.msg}</div>`
        ).join("");
        el.scrollTop = el.scrollHeight;
      }
      function add(tag, msg, obj) {
        if (obj !== undefined) {
          let s;
          try { s = typeof obj === "string" ? obj : JSON.stringify(obj); }
          catch (err) { s = "[unserializable: " + err.message + "]"; }
          msg += " " + s;
        }
        entries.push({ time: new Date().toISOString().slice(11, 23), tag, msg });
        render();
      }
      $("dbgHead").addEventListener("click", (e) => {
        if (e.target.id === "dbgCopy" || e.target.id === "dbgClear" || e.target.id === "dbgRefresh") return;
        $("dbgWrap").classList.toggle("collapsed");
        $("dbgWrap").querySelector(".dbg-toggle").textContent =
          $("dbgWrap").classList.contains("collapsed") ? "▶" : "▼";
      });
      $("dbgCopy").addEventListener("click", () => {
        const text = entries.map(e => `${e.time} ${e.tag.toUpperCase()} ${e.msg}`).join("\n");
        navigator.clipboard ? navigator.clipboard.writeText(text) : document.execCommand("copy");
      });
      $("dbgClear").addEventListener("click", () => {
        entries.length = 0;
        $("dbgBody").innerHTML = "";
      });
      $("dbgRefresh").addEventListener("click", () => {
        location.replace(location.href.split("?")[0] + "?v=" + Date.now());
      });
      return {
        info:  (m, o) => add("info", m, o),
        send:  (m, o) => add("send", m, o),
        recv:  (m, o) => add("recv", m, o),
        warn:  (m, o) => add("warn", m, o),
        error: (m, o) => add("error", m, o),
      };
    })();

    // ── FSM bridge ─────────────────────────────────────────────────────────────
    const fsmBridge = {
      isAvailable: !!(window.fsmHost && typeof window.fsmHost.postMessage === "function"),
      send(command, payload) {
        if (!this.isAvailable) {
          dbg.warn("send skipped — bridge unavailable:", command);
          return Promise.resolve(null);
        }
        return new Promise((resolve) => {
          const reqId = "req-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
          let done = false;
          const finish = (detail) => {
            if (done) return;
            done = true;
            clearTimeout(timer);
            window.removeEventListener("fsmHostResponse", handler);
            resolve(detail);
          };
          const handler = (e) => {
            const d = e && e.detail;
            if (!d) return;
            const matches = d.requestId === reqId || (d.success === false && d.requestId == null);
            if (!matches) return;
            if (d.success === false) dbg.error("error response " + command + " (" + reqId + "):", d.error || d);
            else dbg.recv("response " + command + " (" + reqId + "):", d);
            finish(d);
          };
          const timer = setTimeout(() => {
            if (done) return;
            window.removeEventListener("fsmHostResponse", handler);
            done = true;
            dbg.error("timeout after 8s — no response for " + command + " (" + reqId + ")");
            resolve(null);
          }, 8000);
          window.addEventListener("fsmHostResponse", handler);
          try {
            const msg = JSON.stringify({ apiVersion: 1, requestId: reqId, command, payload: payload || {} });
            dbg.send("post " + command + " (" + reqId + "):", msg);
            window.fsmHost.postMessage(msg);
          } catch (err) {
            done = true;
            clearTimeout(timer);
            window.removeEventListener("fsmHostResponse", handler);
            dbg.error("postMessage threw for " + command + ":", err.message);
            resolve({ success: false, error: { code: "POST_FAILED", message: err.message } });
          }
        });
      },
    };

    dbg.info("bridge availability:", {
      fsmHost: typeof window.fsmHost,
      isAvailable: fsmBridge.isAvailable,
      ua: navigator.userAgent,
    });

    window.addEventListener("fsmHostResponse", (e) => {
      dbg.recv("fsmHostResponse event:", e && e.detail);
    });
    // ── Compartment state ──────────────────────────────────────────────────────
    // Each compartment: { id, name, setting, settingNum, serial, rows: [{ alarm, pressure, temp, maxTol, minTol, result }] }
    let nextId = 1;

    // ── Alarm labels by No. range ──────────────────────────────────────────────
    function alarmLabels(settingNum) {
      const n = parseInt(settingNum, 10);
      if (n >= 401 && n <= 402) return ["Loss P20", "Min", "Rising"];
      if (n >= 607 && n <= 608) return ["Loss P20", "Min", "Loss P20"];
      return ["Loss P20", "Min1", "Min2"]; // 001–004 default
    }

    // ── Loss row tolerances by No. ─────────────────────────────────────────────
    const LOSS_TOL = {
      "001": { max: "5.2",  min: "5"   },
      "002": { max: "4.5",  min: "4.3" },
      "003": { max: "6.7",  min: "6.5" },
      "004": { max: "5.7",  min: "5.5" },
      "401": { max: "2.7",  min: "2.5" },
      "402": { max: "3.2",  min: "3"   },
      "607": { max: "6.7",  min: "6.5" },
      "608": { max: "7.2",  min: "7"   },
    };

    function makeCompartment(settingNum = "001") {
      const labels = alarmLabels(settingNum);
      const tol = LOSS_TOL[settingNum] || { max: "5.2", min: "5" };
      return {
        id: nextId++,
        name: "",
        setting: "Setting",
        settingNum,
        serial: "",
        rows: [
          { alarm: labels[0], pressure: "0,00", temp: "", maxTol: tol.max,  minTol: tol.min,  result: "" },
          { alarm: labels[1], pressure: "0,00", temp: "", maxTol: "-0.20", minTol: "-0.35", result: "" },
          { alarm: labels[2], pressure: "0,00", temp: "", maxTol: "-0.20", minTol: "-0.35", result: "" },
        ],
      };
    }

    let compartments = [makeCompartment()];

    function calcP20(pressure, temp) {
      const p = parseFloat(String(pressure).replace(",", "."));
      const t = parseFloat(String(temp).replace(",", "."));
      if (isNaN(p) || isNaN(t)) return "";
      const p20 = p * (293.15 / (273.15 + t));
      return p20.toFixed(2).replace(".", ",");
    }

    // ── Card rendering ─────────────────────────────────────────────────────────
    function renderTable() {
      const list = $("gasBody");
      list.innerHTML = "";

      compartments.forEach((comp, ci) => {
        const card = document.createElement("div");
        card.className = "comp-card";

        // Header: name input + control buttons
        const hdr = document.createElement("div");
        hdr.className = "comp-card-header";
        hdr.innerHTML =
          `<input class="comp-name-input" type="text" placeholder="Compartment name" data-ci="${ci}" data-field="name" value="${escVal(comp.name)}" />` +
          `<span class="ctrl-btn" data-action="up"     data-ci="${ci}">↑</span>` +
          `<span class="ctrl-btn" data-action="down"   data-ci="${ci}">↓</span>` +
          `<span class="ctrl-btn" data-action="add"    data-ci="${ci}">+</span>` +
          `<span class="ctrl-btn" data-action="remove" data-ci="${ci}">−</span>`;
        card.appendChild(hdr);

        // Meta: setting + serial number
        const meta = document.createElement("div");
        meta.className = "comp-card-meta";
        meta.innerHTML =
          `<div class="meta-group">` +
            `<div class="meta-lbl">Setting</div>` +
            `<select data-ci="${ci}" data-field="setting">` +
              `<option${comp.setting === "Setting" ? " selected" : ""}>Setting</option>` +
              `<option${comp.setting === "Custom"  ? " selected" : ""}>Custom</option>` +
            `</select>` +
          `</div>` +
          `<div class="meta-group">` +
            `<div class="meta-lbl">No.</div>` +
            `<select data-ci="${ci}" data-field="settingNum">` +
              `${["001","002","003","004","401","402","607","608"].map(v =>
                `<option value="${v}"${comp.settingNum===v?" selected":""}>${v}</option>`).join("")}` +
            `</select>` +
          `</div>` +
          `<div class="sn-row">` +
            `<div class="meta-lbl">Serial number</div>` +
            `<input type="text" data-ci="${ci}" data-field="serial" value="${escVal(comp.serial)}" placeholder="" />` +
          `</div>`;
        card.appendChild(meta);

        // Alarm rows
        const labels = alarmLabels(comp.settingNum);
        comp.rows.forEach((row, ri) => {
          const alarmRow = document.createElement("div");
          alarmRow.className = "comp-alarm-row";
          if (row.result === "OK")   alarmRow.classList.add("alarm-row-ok");
          if (row.result === "Fail") alarmRow.classList.add("alarm-row-fail");

          alarmRow.innerHTML =
            `<div class="alarm-label">${labels[ri]}</div>` +
            `<div class="fld"><div class="fld-lbl">Pressure</div>` +
              `<input type="number" step="0.01" placeholder="0.00" data-ci="${ci}" data-ri="${ri}" data-field="pressure" value="${row.pressure ? row.pressure.replace(",", ".") : ""}"/></div>` +
            `<div class="fld"><div class="fld-lbl">Temp °C</div>` +
              `<input type="number" step="0.1" data-ci="${ci}" data-ri="${ri}" data-field="temp" value="${row.temp ? row.temp.replace(",", ".") : ""}"/></div>` +
            `<div class="fld"><div class="fld-lbl">P20</div>` +
              `<input type="text" class="p20-val" readonly tabindex="-1" id="p20_${comp.id}_${ri}" value="${calcP20(row.pressure, row.temp)}"/></div>` +
            `<div class="fld"><div class="fld-lbl">Max tol.</div>` +
              `<input type="number" step="0.01" class="tol" data-ci="${ci}" data-ri="${ri}" data-field="maxTol" value="${row.maxTol ? row.maxTol.replace(",", ".") : ""}"/></div>` +
            `<div class="fld"><div class="fld-lbl">Min tol.</div>` +
              `<input type="number" step="0.01" class="tol" data-ci="${ci}" data-ri="${ri}" data-field="minTol" value="${row.minTol ? row.minTol.replace(",", ".") : ""}"/></div>` +
            `<div class="fld"><div class="fld-lbl">Result</div>` +
              `<select data-ci="${ci}" data-ri="${ri}" data-field="result">` +
                `<option value="">–</option>` +
                `<option value="OK"${row.result==="OK"?" selected":""}>OK</option>` +
                `<option value="Fail"${row.result==="Fail"?" selected":""}>Fail</option>` +
                `<option value="N/A"${row.result==="N/A"?" selected":""}>N/A</option>` +
              `</select></div>`;

          card.appendChild(alarmRow);
        });

        list.appendChild(card);
      });
    }

    function escVal(v) {
      return String(v || "").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    }

    // ── Card event delegation ──────────────────────────────────────────────────
    $("gasBody").addEventListener("input", (e) => {
      const el = e.target;
      const ci = el.dataset.ci !== undefined ? parseInt(el.dataset.ci) : null;
      const ri = el.dataset.ri !== undefined ? parseInt(el.dataset.ri) : null;
      const field = el.dataset.field;
      if (ci === null || !field) return;

      const comp = compartments[ci];
      if (!comp) return;

      if (ri !== null && ri >= 0) {
        comp.rows[ri][field] = el.value;

        if (field === "pressure" || field === "temp") {
          const row = comp.rows[ri];
          const p20El = $(`p20_${comp.id}_${ri}`);
          if (p20El) p20El.value = calcP20(row.pressure, row.temp);
        }

        if (field === "result") {
          const alarmRow = el.closest(".comp-alarm-row");
          if (alarmRow) {
            alarmRow.classList.toggle("alarm-row-ok",   el.value === "OK");
            alarmRow.classList.toggle("alarm-row-fail", el.value === "Fail");
          }
        }
      } else {
        if (field === "settingNum") {
          const prev = comp.settingNum;
          if (el.value === prev) return;
          const prevLabels = alarmLabels(prev);
          const newLabels  = alarmLabels(el.value);
          const labelsChanged = prevLabels.some((l, i) => l !== newLabels[i]);
          const prevTol = LOSS_TOL[prev] || { max: "5.2", min: "5" };
          const newTol  = LOSS_TOL[el.value] || { max: "5.2", min: "5" };
          const tolChanged = prevTol.max !== newTol.max || prevTol.min !== newTol.min;
          comp[field] = el.value;
          comp.rows[0].maxTol = newTol.max;
          comp.rows[0].minTol = newTol.min;
          renderTable();
          const card = $("gasBody").children[ci];
          if (card) {
            if (labelsChanged) {
              card.querySelectorAll(".alarm-label").forEach(lbl => {
                lbl.classList.remove("blink");
                void lbl.offsetWidth;
                lbl.classList.add("blink");
              });
            }
            if (tolChanged) {
              const firstAlarmRow = card.querySelector(".comp-alarm-row");
              if (firstAlarmRow) {
                firstAlarmRow.querySelectorAll(".tol").forEach(inp => {
                  inp.classList.remove("blink");
                  void inp.offsetWidth;
                  inp.classList.add("blink");
                });
              }
            }
          }
        } else {
          comp[field] = el.value;
        }
      }
    });

    $("gasBody").addEventListener("click", (e) => {
      const btn = e.target.closest(".ctrl-btn");
      if (!btn) return;
      const ci = parseInt(btn.dataset.ci);
      const action = btn.dataset.action;

      if (action === "add") {
        compartments.splice(ci + 1, 0, makeCompartment());
      } else if (action === "remove") {
        if (compartments.length === 1) return;
        compartments.splice(ci, 1);
      } else if (action === "up") {
        if (ci === 0) return;
        [compartments[ci - 1], compartments[ci]] = [compartments[ci], compartments[ci - 1]];
      } else if (action === "down") {
        if (ci === compartments.length - 1) return;
        [compartments[ci], compartments[ci + 1]] = [compartments[ci + 1], compartments[ci]];
      }

      renderTable();
    });

    // ── Add compartment button ─────────────────────────────────────────────────
    $("btnAddComp").addEventListener("click", () => {

    // ── PDF generation ─────────────────────────────────────────────────────────
    let _pdfBlob = null;

    function generatePDF(payload) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

      let y = 14;

      // Header bar

      doc.setTextColor(255, 255, 255);
      doc.text("High Voltage Switchgear 8D/8V — Function Test Gas Monitoring", margin, 8);
      doc.setFont("helvetica", "normal");
      doc.text("TR 3004  |  SE GT PRM PLM 01/2024", W - margin, 8, { align: "right" });
      y = 18;

      // Report title
      doc.setFont("helvetica", "bold");
      doc.setFontSize(13);
      doc.setTextColor(...dark);
      doc.text("Test Report  v" + APP_VERSION, margin, y);
      const today = new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
      doc.setTextColor(...grey);
      doc.text(today, W - margin, y, { align: "right" });
      y += 7;

      // Header info table
      const hRows = [
        ["Equipment Name", payload.header.equipmentName || "—", "Rated Voltage", (payload.header.ratedVoltageKV != null ? payload.header.ratedVoltageKV + " kV" : "—")],
        ["Serial Number",  payload.header.serialNumber  || "—", "", ""],
      ];
      doc.autoTable({
        startY: y,
        margin: { left: margin, right: margin },
        tableWidth: colW,
        body: hRows,
        theme: "plain",
        styles: { fontSize: 9, cellPadding: 2 },
        columnStyles: {
          0: { fontStyle: "bold", textColor: grey, cellWidth: 36 },
          1: { textColor: dark,  cellWidth: colW / 2 - 36 },
          2: { fontStyle: "bold", textColor: grey, cellWidth: 36 },
          3: { textColor: dark },
        },
        didDrawPage: () => {},
      });
      y = doc.lastAutoTable.finalY + 4;

      // Conditions row
      doc.setFillColor(...light);
      doc.roundedRect(margin, y, colW, 8, 1, 1, "F");
      doc.setFont("helvetica", "bold");
      doc.setFontSize(8);
      doc.setTextColor(...grey);
      doc.text("Above sea level:", margin + 3, y + 5.5);
      doc.setFont("helvetica", "normal");
      doc.setTextColor(...dark);
      doc.text(payload.conditions.altitudeAboveSeaLevel + " " + payload.conditions.altitudeUnit, margin + 33, y + 5.5);
      doc.setFont("helvetica", "bold");
      doc.setTextColor(...grey);
      doc.text("Pressure unit:", margin + 70, y + 5.5);
      doc.setFont("helvetica", "normal");
      doc.setTextColor(...dark);
      doc.text(payload.conditions.pressureUnit, margin + 94, y + 5.5);
      y += 12;

      // Compartments
      payload.compartments.forEach((comp, ci) => {
        // Check if new page needed (estimate ~30mm per compartment)
        if (y > 260) { doc.addPage(); y = 14; }

        // Compartment header
        doc.setFillColor(...blue);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(9);
        doc.setTextColor(255, 255, 255);
        doc.rect(margin, y, colW, 7, "F");
        const compLabel = "Compartment " + (ci + 1) + (comp.name ? "  –  " + comp.name : "");
        doc.text(compLabel, margin + 3, y + 5);
        const settingLabel = comp.setting !== "Setting" ? comp.setting : "Setting";
        doc.text("No. " + comp.settingNum + "   " + settingLabel, W - margin - 3, y + 5, { align: "right" });
        if (comp.serial) {
          doc.setFont("helvetica", "normal");
          doc.text("S/N: " + comp.serial, W - margin - 3 - 50, y + 5, { align: "right" });
        }
        y += 7;

        // Alarm rows table
        const head = [["Alarm", "Pressure", "Temp °C", "P20 value", "max Tol.", "min Tol.", "Result"]];
        const body = comp.rows.map(row => [
          row.alarm,
          row.pressure,
          row.tempC != null ? String(row.tempC) : "",
          row.p20  != null ? String(row.p20)   : "",
          row.maxTol,
          row.minTol,
          row.result || "",

        doc.autoTable({
          startY: y,
          margin: { left: margin, right: margin },
          tableWidth: colW,
          head,

          theme: "striped",

              const v = data.cell.raw;

              if (v === "Fail") data.cell.styles.textColor = [190, 30, 30];
            }
          },

        y = doc.lastAutoTable.finalY + 5;
      });

      // Footer on each page
      const pageCount = doc.internal.getNumberOfPages();
      for (let i = 1; i <= pageCount; i++) {
        doc.setPage(i);

    function showPDF(payload) {
      dbg.info("showPDF: start");

      if (!window.jspdf) {
        dbg.error("showPDF: window.jspdf is undefined — jsPDF CDN script did not load");
        alert("PDF library failed to load. Check your internet connection and try again.");
        return;
      }

      let doc;
      try {
        dbg.info("showPDF: calling generatePDF");
        doc = generatePDF(payload);
        dbg.info("showPDF: generatePDF OK");
      } catch (err) {
        dbg.error("showPDF: generatePDF threw:", err && err.message ? err.message : String(err));
        alert("PDF generation failed: " + (err && err.message ? err.message : String(err)));
        return;
      }

      let blob;
      try {
        blob = doc.output("blob");
        _pdfBlob = blob;
        dbg.info("showPDF: blob created, size:", blob.size);
      } catch (err) {
        dbg.error("showPDF: doc.output threw:", err && err.message ? err.message : String(err));
        return;
      }

      // Render PDF pages to canvas via PDF.js — works inside any WebView
      if (!window._pdfjsLoaded || !window.pdfjsLib) {
        dbg.warn("showPDF: PDF.js not loaded, falling back to download only");
        _triggerDownload(blob);
        return;
      }

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const typedArray = new Uint8Array(e.target.result);
          dbg.info("showPDF: calling getDocument");
          const pdfDoc = await pdfjsLib.getDocument({ data: typedArray, disableWorker: true }).promise;
          dbg.info("showPDF: PDF.js loaded doc, pages:", pdfDoc.numPages);

          const container = $("pdfPages");
          container.innerHTML = "";

          // Show modal first so clientWidth is available for scaling
          $("pdfOverlay").classList.add("show");
          dbg.info("showPDF: modal opened");

          const devicePixelRatio = window.devicePixelRatio || 1;

          for (let p = 1; p <= pdfDoc.numPages; p++) {
            const page = await pdfDoc.getPage(p);
            const viewport = page.getViewport({ scale: 1 });
            const viewerWidth = Math.max($("pdfViewer").clientWidth, 300);
            const scale = viewerWidth / viewport.width;
            const scaledViewport = page.getViewport({ scale });
            dbg.info("showPDF: page", p, "viewerWidth:", viewerWidth, "scale:", scale.toFixed(3));

            const canvas = document.createElement("canvas");
            canvas.width  = Math.round(scaledViewport.width  * devicePixelRatio);
            canvas.height = Math.round(scaledViewport.height * devicePixelRatio);
            canvas.style.width  = Math.round(scaledViewport.width)  + "px";
            canvas.style.height = Math.round(scaledViewport.height) + "px";
            container.appendChild(canvas);

            const ctx = canvas.getContext("2d");
            ctx.scale(devicePixelRatio, devicePixelRatio);
            await page.render({ canvasContext: ctx, viewport: scaledViewport }).promise;
            dbg.info("showPDF: rendered page", p, "canvas:", canvas.width, "x", canvas.height);
          }
        } catch (err) {
          dbg.error("showPDF: PDF.js render threw:", err && err.message ? err.message : String(err));
          alert("PDF preview failed. Downloading instead.");
          _triggerDownload(blob);
        }
      };
      reader.readAsArrayBuffer(blob);
    }

    function _triggerDownload(blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const name = ($("h_bay").textContent.trim() || "GasMonitoring").replace(/\s+/g, "_");
      a.href = url;
      a.download = "TR3004_" + name + "_" + new Date().toISOString().slice(0, 10) + ".pdf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      dbg.info("_triggerDownload: filename:", a.download);
    }

    $("pdfBtnClose").addEventListener("click", () => {
      $("pdfOverlay").classList.remove("show");
      $("pdfPages").innerHTML = "";
      _pdfBlob = null;

    $("pdfBtnDl").addEventListener("click", () => {

    $("pdfBtnShare").addEventListener("click", async () => {
      if (!_pdfBlob) return;
      const name = ($("h_bay").textContent.trim() || "GasMonitoring").replace(/\s+/g, "_");
      const filename = "TR3004_" + name + "_" + new Date().toISOString().slice(0, 10) + ".pdf";
      dbg.info("share: navigator.share=", typeof navigator.share, "navigator.canShare=", typeof navigator.canShare);
      const file = new File([_pdfBlob], filename, { type: "application/pdf" });
      // Try file sharing first
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: "Test Report TR 3004", text: filename });
          dbg.info("share: file share completed");
          return;
        } catch (err) {
          if (err.name === "AbortError") { dbg.info("share: user cancelled"); return; }
          dbg.warn("share: file share failed:", err.message, "— trying text share");
        }
      } else {
        dbg.warn("share: canShare(files) not supported");
      }
      // Try sharing a download link as fallback
      if (navigator.share) {
        try {
          const url = URL.createObjectURL(_pdfBlob);
          await navigator.share({ title: "Test Report TR 3004", text: filename, url });
          dbg.info("share: url share completed");
          return;
        } catch (err) {
          if (err.name === "AbortError") { dbg.info("share: user cancelled"); return; }
          dbg.warn("share: url share failed:", err.message, "— falling back to download");
        }
      } else {
        dbg.warn("share: navigator.share not available — falling back to download");
      }
      _triggerDownload(_pdfBlob);
    });

            alarm:    alarmLabels(comp.settingNum)[ri],
            pressure: parseFloat(String(row.pressure).replace(",", ".")) || 0,
            tempC:    row.temp !== "" ? parseFloat(String(row.temp).replace(",", ".")) : null,
            p20:      calcP20(row.pressure, row.temp),
            maxTol:   parseFloat(String(row.maxTol).replace(",", ".")) || 0,
            minTol:   parseFloat(String(row.minTol).replace(",", ".")) || 0,
            result:   row.result,
          })),
        })),
      };

      dbg.info("submit: payload built, compartments:", payload.compartments.length);
      showPDF(payload);
      panel.className = "result-panel";

      if (fsmBridge.isAvailable) {
        const activity = {
          subject: "Test report – " + ($("h_bay").textContent.trim() || "Gas Monitoring"),
          remarks: JSON.stringify(payload),
        };
        fsmBridge.send("ACTIVITY_SAVE", activity).then((res) => {
          if (res && res.success === false) dbg.error("ACTIVITY_SAVE failed:", res.error || res);
          else if (res) dbg.info("ACTIVITY_SAVE ok:", res.payload);
        });
      }
    });

    // ── Init ───────────────────────────────────────────────────────────────────
    renderTable();
    $("appVersionLabel").textContent = "v" + APP_VERSION;
    dbg.info("init: version", APP_VERSION);
    dbg.info("init: jsPDF loaded:", !!window._jspdfLoaded, window._jspdfLoadError || "");
    dbg.info("init: autoTable loaded:", !!window._autotableLoaded, window._autotableLoadError || "");
    dbg.info("init: PDF.js loaded:", !!window._pdfjsLoaded, window._pdfjsLoadError || "");
    dbg.info("init: window.jspdf:", typeof window.jspdf);

    (async function loadActivityInfo() {
      if (!fsmBridge.isAvailable) {
        dbg.warn("bridge unavailable — skipping activity load");
        return;
      }

      const ctxRes = await fsmBridge.send("CONTEXT_REQUEST", {});
      if (!ctxRes || ctxRes.success === false) {
        dbg.error("CONTEXT_REQUEST failed", ctxRes);
        return;
      }
      dbg.info("context keys:", Object.keys(ctxRes.payload || {}));
      dbg.info("context:", ctxRes.payload);

      const urlActivityId = new URLSearchParams(window.location.search).get("activityId");
      const activityId = urlActivityId ||
        (ctxRes.payload.objectType === "ACTIVITY" && ctxRes.payload.cloudId) ||
        ctxRes.payload.activityId ||
        ctxRes.payload.activity_id ||
        ctxRes.payload.objectId;
      dbg.info("activityId source:", urlActivityId ? "URL param" : "context.cloudId");
      dbg.info("activityId:", activityId);
      if (!activityId) {
        dbg.warn("no activity ID in context — PWA must be opened from an activity in FSM, not standalone");
        return;
      }

      const actRes = await fsmBridge.send("ACTIVITY_GET", { activityId });
      if (!actRes || actRes.success === false) {
        dbg.error("ACTIVITY_GET failed", actRes);
        return;
      }
      dbg.warn("▶ ACTIVITY:", actRes.payload);

      const act = actRes.payload || {};

      const equipmentId = actRes.payload && (
        actRes.payload.equipmentId ||
        actRes.payload.equipment_id ||
        actRes.payload.equipment
      );
      if (!equipmentId) {
        dbg.warn("no equipmentId on activity — keys:", Object.keys(actRes.payload || {}));
        return;
      }
      dbg.info("equipmentId:", equipmentId);

      const eqRes = await fsmBridge.send("EQUIPMENT_GET", { equipmentId });
      if (!eqRes || eqRes.success === false) {
        dbg.error("EQUIPMENT_GET failed", eqRes);
        return;
      }
      dbg.warn("▶ EQUIPMENT:", eqRes.payload);
      const eq = eqRes.payload || {};
      if (eq.name)         { $("h_bay").textContent = eq.name;         dbg.info("bay/feeder populated from equipment.name:", eq.name); }
      if (eq.serialNumber) { $("h_serial").textContent = eq.serialNumber; dbg.info("serial number populated from equipment.serialNumber:", eq.serialNumber); }
    })();

    // Altitude auto-load
    function fetchAltitude(userTriggered) {
      if (!navigator.geolocation) {
        if (userTriggered) $("alt_status").textContent = "Geolocation not supported by this browser.";
        return;
      }
      $("alt_status").textContent = "Locating…";
      $("btn_geolocate").disabled = true;
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          $("btn_geolocate").disabled = false;
          if (pos.coords.altitude === null) {
            $("alt_status").textContent = "Device did not provide altitude.";
            dbg.warn("Geolocation: altitude is null");
            return;
          }
          let val = pos.coords.altitude;
          if ($("c_alt_unit").value === "ft") val = val * 3.28084;
          $("c_altitude").value = Math.round(val);
          const acc = pos.coords.altitudeAccuracy !== null ? " (±" + Math.round(pos.coords.altitudeAccuracy) + " m)" : "";
          $("alt_status").textContent = "GPS altitude loaded" + acc + ". You can edit this value.";
          dbg.info("Altitude from GPS:", pos.coords.altitude, "m raw; stored:", $("c_altitude").value, $("c_alt_unit").value);
        },
        (err) => {
          $("btn_geolocate").disabled = false;
          const msgs = { 1: "Location permission denied.", 2: "Position unavailable.", 3: "Request timed out." };
          $("alt_status").textContent = msgs[err.code] || "Geolocation error.";
          dbg.warn("Geolocation error:", err.message);
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
      );
    }

    $("btn_geolocate").addEventListener("click", () => fetchAltitude(true));
    // Re-fetch when unit changes so the stored value stays in sync
    $("c_alt_unit").addEventListener("change", () => {
      if ($("c_altitude").value !== "") fetchAltitude(false);
    });
    fetchAltitude(false);

    // ── Version check ──────────────────────────────────────────────────────────
    // If no cache-bust param present, redirect immediately so WebView always
    // fetches a fresh copy rather than serving a cached version.
    if (!location.search.includes("v=")) {
      location.replace(location.href.split("?")[0] + "?v=" + Date.now());
    }

    (async function checkForUpdate() {
      try {
        const url = location.href.split("?")[0] + "?v=" + Date.now();
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) { dbg.warn("version check: fetch failed, status:", res.status); return; }
        const text = await res.text();
        const match = text.match(/APP_VERSION\s*=\s*"([^"]+)"/);
        if (!match) { dbg.warn("version check: APP_VERSION not found in fetched page"); return; }
        const remoteVersion = match[1];
        dbg.info("version check: local=" + APP_VERSION + " remote=" + remoteVersion);
        if (remoteVersion !== APP_VERSION) {
          $("updateBannerMsg").textContent = "New version available: v" + remoteVersion + " (you have v" + APP_VERSION + ")";
          $("updateBanner").classList.add("show");
        }
      } catch (err) {
        dbg.warn("version check: error:", err && err.message ? err.message : String(err));
      }
    })();

    $("updateBannerBtn").addEventListener("click", () => {
      location.replace(location.href.split("?")[0] + "?v=" + Date.now());
    });
  </script>
</body>
</html>
