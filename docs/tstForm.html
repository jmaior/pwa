<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Test Report</title>
  <style>
    :root {
      --bar: #354a5f;
      --accent: #0070b8;
      --bg: #f2f2f2;
      --card: #fff;
      --label: #6b6b6b;
      --divider: rgba(0,0,0,0.08);
      --red-border: #c23934;
      --yellow-bg: #fff9c4;
      --tol-bg: #e8eaf0;
      --result-ok: #2e844a;
      --result-fail: #c23934;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    /* ── Top bar ── */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bar);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      padding-top: calc(10px + env(safe-area-inset-top));
    }
    .top-bar .title { font-size: 15px; font-weight: 700; letter-spacing: .3px; }
    .top-bar .ref { font-size: 11px; opacity: .75; text-align: right; line-height: 1.4; }

    /* ── Report heading ── */
    .report-heading {
      background: #fff;
      border-bottom: 2px solid #222;
      padding: 12px 16px 10px;
    }
    .report-heading .en { font-size: 15px; font-weight: 700; }
    .report-heading .sub-en { font-size: 13px; font-weight: 600; margin-top: 8px; }
    .report-heading .tr-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-top: 2px solid #222;
      margin-top: 10px;
      padding-top: 6px;
      gap: 8px;
    }
    .report-heading .tr-label { font-size: 13px; font-weight: 700; }
    .report-heading .tr-label span { font-weight: 400; font-size: 12px; color: #555; }
    .report-heading .tr-code { font-size: 15px; font-weight: 700; }
    .report-heading .tr-ref { font-size: 12px; color: #444; text-align: right; }

    /* ── Page layout ── */
    .page {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 0 80px;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border-radius: 0;
      box-shadow: 0 1px 0 var(--divider);
      padding: 0 16px;
      margin-bottom: 8px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--label);
      padding: 10px 0 6px;
      border-bottom: 1px solid var(--divider);
    }

    /* ── Two-column header grid ── */
    .header-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 16px;
    }
    @media (max-width: 500px) {
      .header-grid { grid-template-columns: 1fr; }
    }
    .field {
      padding: 9px 0;
      border-bottom: 1px solid var(--divider);
    }
    .field:last-child { border-bottom: none; }
    .lbl {
      font-size: 11px;
      color: var(--label);
      line-height: 1.3;
      margin-bottom: 4px;
    }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      font-size: 14px;
      padding: 5px 7px;
      border: 1px solid #c8c8c8;
      border-radius: 4px;
      background: #eef2fb;
      color: #1a1a1a;
      appearance: none;
      -webkit-appearance: none;
    }
    input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }
    .inline-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .inline-row input, .inline-row select { flex: 1; }
    .unit-label { font-size: 13px; font-weight: 600; white-space: nowrap; }

    /* ── Conditions bar ── */
    .conditions-card {
      background: var(--card);
      box-shadow: 0 1px 0 var(--divider);
      padding: 10px 16px;
      margin-bottom: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      align-items: flex-end;
    }
    .cond-group { display: flex; flex-direction: column; gap: 4px; }
    .cond-group .lbl { margin-bottom: 0; }
    .cond-group .inline-row input[type="number"] { width: 80px; }
    .red-border input { border-color: var(--red-border) !important; border-width: 2px !important; }
    .highlighted select { border-color: var(--red-border) !important; border-width: 2px !important; }
    .hide-sn-label {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--yellow-bg);
      border: 1px solid #e0c800;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .hide-sn-label input[type="checkbox"] {
      width: 16px; height: 16px;
      flex-shrink: 0;
      border: 1px solid #888;
      background: #fff;
      border-radius: 2px;
      appearance: auto;
      -webkit-appearance: auto;
    }

    /* ── Compartments table ── */
    .table-wrapper {
      overflow-x: auto;
      margin-bottom: 8px;
      background: var(--card);
    }
    table.gas-table {
      border-collapse: collapse;
      width: 100%;
      min-width: 680px;
      font-size: 12px;
    }
    .gas-table th {
      background: #e6e9ef;
      border: 1px solid #b0b8c8;
      padding: 5px 6px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
      white-space: nowrap;
    }
    .gas-table td {
      border: 1px solid #c8cdd8;
      padding: 3px 5px;
      vertical-align: middle;
    }
    .gas-table input[type="number"], .gas-table input[type="text"], .gas-table select {
      font-size: 12px;
      padding: 3px 5px;
      min-width: 56px;
      background: #eef2fb;
    }
    .gas-table input.tol { background: var(--tol-bg); min-width: 52px; }
    .gas-table input.p20-val { background: #f0f0f0; color: #555; min-width: 52px; }
    .gas-table .alarm-cell { text-align: center; font-weight: 700; white-space: nowrap; }
    .gas-table .result-cell select { min-width: 72px; }
    .gas-table .result-ok { background: #d4edda; }
    .gas-table .result-fail { background: #f8d7da; }

    /* Compartment left cell */
    .comp-ctrl-cell {
      vertical-align: middle;
      text-align: center;
      background: #f0f2f8;
      padding: 4px 3px;
      white-space: nowrap;
    }
    .comp-ctrl-cell .ctrl-btn {
      display: block;
      width: 24px;
      height: 24px;
      line-height: 24px;
      text-align: center;
      margin: 2px auto;
      font-size: 14px;
      font-weight: 700;
      background: #d0d4e0;
      border: 1px solid #aab;
      border-radius: 3px;
      cursor: pointer;
      user-select: none;
    }
    .comp-ctrl-cell .ctrl-btn:active { background: #b0b8cc; }

    .comp-info-cell {
      vertical-align: top;
      min-width: 130px;
      background: #f8f9fc;
    }
    .comp-info-cell .setting-label {
      font-size: 10px;
      color: #555;
      margin-bottom: 3px;
      line-height: 1.3;
    }
    .comp-info-cell .setting-row {
      display: flex;
      gap: 3px;
      margin-bottom: 4px;
    }
    .comp-info-cell .setting-row select { flex: 1; min-width: 60px; }
    .comp-info-cell .setting-row input { width: 46px; flex-shrink: 0; }
    .comp-info-cell .sn-row { margin-top: 2px; }
    .comp-info-cell .sn-row .sn-label { font-size: 10px; color: #555; }
    .comp-name-input { width: 100%; font-size: 12px; font-weight: 600; margin-bottom: 4px; }

    /* Hide serial number */
    body.hide-serial .sn-row { display: none; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: .85; }
    .btn.secondary { background: #e0e4ea; color: #1a1a1a; }
    .btn.add-comp { background: #fff; border: 1px solid var(--accent); color: var(--accent); width: 100%; margin: 6px 0 4px; }

    /* ── Submit area ── */
    .submit-area {
      padding: 12px 16px;
      background: var(--card);
      box-shadow: 0 1px 0 var(--divider);
      margin-bottom: 8px;
    }
    .submit-area .btn { width: 100%; }

    .result-panel {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      background: #f0f8f0;
      border: 1px solid #9ec;
      border-radius: 6px;
      font-size: 11px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 260px;
      overflow-y: auto;
    }
    .result-panel.error { background: #fff0f0; border-color: #f9a; }
    .result-panel.show { display: block; }

    /* ── Debug log ── */
    .dbg-wrap {
      margin: 8px 16px 16px;
      border-radius: 6px;
      overflow: hidden;
      font-size: 11px;
    }
    .dbg-head {
      display: flex;
      align-items: center;
      background: #2a2a2a;
      color: #ccc;
      padding: 6px 10px;
      cursor: pointer;
      user-select: none;
      gap: 8px;
    }
    .dbg-head .dbg-toggle { font-family: monospace; }
    .dbg-head .dbg-copy { margin-left: auto; font-size: 11px; color: #aaa; cursor: pointer; }
    .dbg-body {
      background: #1a1a1a;
      color: #e0e0e0;
      max-height: 200px;
      overflow-y: auto;
      padding: 6px 10px;
      font-family: monospace;
    }
    .dbg-wrap.collapsed .dbg-body { display: none; }
    .dbg-entry { margin-bottom: 2px; line-height: 1.5; }
    .dbg-time { color: #666; margin-right: 6px; }
    .dbg-tag { padding: 1px 5px; border-radius: 3px; margin-right: 5px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .dbg-tag.info  { background: #1e3a5f; color: #7ec8e3; }
    .dbg-tag.send  { background: #0d3d2a; color: #5dd39e; }
    .dbg-tag.recv  { background: #3a2a00; color: #ffc94a; }
    .dbg-tag.warn  { background: #3a2a00; color: #ffc94a; }
    .dbg-tag.error { background: #4a1010; color: #f88; }
  </style>
</head>
<body>

  <div class="top-bar">
  </div>

  <div class="page">

    <!-- Report heading -->
    <div class="report-heading">
      <div class="tr-row">
        <div>
          <span class="tr-label">Test report</span>
        </div>
      </div>
    </div>

    <!-- Header fields -->
    <div class="card" style="margin-top:8px;">
      <div class="header-grid">
        <!-- Left column -->
        <div>
          <div class="field">
            <div class="lbl">Customer</div>
            <input type="text" id="h_customer" placeholder="" />
          </div>
          <div class="field">
            <div class="lbl">Consultant</div>
            <input type="text" id="h_consultant" placeholder="" />
          </div>
          <div class="field">
            <div class="lbl">Substation</div>
            <input type="text" id="h_substation" placeholder="" />
          </div>
          <div class="field" style="border-bottom:none;">
            <div class="lbl">Switchgear type</div>
            <select id="h_sgtype">
              <option>GIL</option>
              <option>8DA</option>
              <option>8DB</option>
              <option>8DH</option>
              <option>8DJH</option>
              <option>Other</option>
            </select>
          </div>
        </div>
        <!-- Right column -->
        <div>
          <div class="field">
            <div class="lbl">Contract number</div>
            <input type="text" id="h_contract" placeholder="" />
          </div>
          <div class="field">
            <div class="lbl">Bay / Feeder</div>
            <input type="text" id="h_bay" placeholder="" />
          </div>
          <div class="field">
            <div class="lbl">Serial number</div>
            <input type="text" id="h_serial" placeholder="" />
          </div>
          <div class="field" style="border-bottom:none;">
            <div class="lbl">Rated voltage</div>
            <div class="inline-row">
              <input type="number" id="h_voltage" inputmode="decimal" placeholder="0" min="0" step="0.1" />
              <span class="unit-label">kV</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Measurement conditions -->
    <div class="conditions-card">
      <div class="cond-group red-border">
        <div class="lbl">Above sea level</div>
        <div class="inline-row">
          <input type="number" id="c_altitude" inputmode="decimal" placeholder="0" min="0" />
          <select id="c_alt_unit" style="width:60px;">
            <option>m</option>
            <option>ft</option>
          </select>
        </div>
      </div>
      <div class="cond-group highlighted">
        <div class="lbl">Unit</div>
        <select id="c_unit" style="width:130px;">
          <option>bar (rel.)</option>
          <option>bar (abs.)</option>
          <option>MPa</option>
          <option>psi (rel.)</option>
        </select>
      </div>
      <div class="cond-group">
        <label class="hide-sn-label">
          Hide Serial Number
          <input type="checkbox" id="c_hide_sn" />
        </label>
      </div>
    </div>

    <!-- Compartments table -->
    <div class="table-wrapper">
      <table class="gas-table" id="gasTable">
        <thead>
          <tr>
            <th colspan="2">Compartment</th>
            <th>Specifications</th>
            <th>Alarms</th>
            <th>Pressure</th>
            <th>Temp °C</th>
            <th>P20-value</th>
            <th>max.Tolerance</th>
            <th>min.Tolerance</th>
            <th>Result</th>
          </tr>
        </thead>
        <tbody id="gasBody"></tbody>
      </table>
    </div>

    <div style="padding: 0 16px 4px;">
      <button class="btn add-comp" id="btnAddComp">+ Add compartment</button>
    </div>

    <!-- Submit -->
    <div class="submit-area">
      <button class="btn" id="btnSubmit">Submit report</button>
      <div class="result-panel" id="resultPanel"></div>
    </div>

    <!-- Debug log -->
    <div class="dbg-wrap collapsed" id="dbgWrap">
      <div class="dbg-head" id="dbgHead">
        <span class="dbg-toggle">▶</span>
        <span>Debug log</span>
        <span class="dbg-copy" id="dbgCopy">Copy</span>
      </div>
      <div class="dbg-body" id="dbgBody"></div>
    </div>

  </div><!-- .page -->

  <script>
    const $ = id => document.getElementById(id);

    // ── Debug log ──────────────────────────────────────────────────────────────
    const dbg = (function () {
      const entries = [];
      function render() {
        const el = $("dbgBody");
        if (!el) return;
        el.innerHTML = entries.map(e =>
          `<div class="dbg-entry"><span class="dbg-time">${e.time}</span>` +
          `<span class="dbg-tag ${e.tag}">${e.tag}</span>${e.msg}</div>`
        ).join("");
        el.scrollTop = el.scrollHeight;
      }
      function add(tag, msg, obj) {
        if (obj !== undefined) {
          let s;
          try { s = typeof obj === "string" ? obj : JSON.stringify(obj); }
          catch (err) { s = "[unserializable: " + err.message + "]"; }
          msg += " " + s;
        }
        entries.push({ time: new Date().toISOString().slice(11, 23), tag, msg });
        render();
      }
      $("dbgHead").addEventListener("click", (e) => {
        if (e.target.id === "dbgCopy") return;
        $("dbgWrap").classList.toggle("collapsed");
        $("dbgWrap").querySelector(".dbg-toggle").textContent =
          $("dbgWrap").classList.contains("collapsed") ? "▶" : "▼";
      });
      $("dbgCopy").addEventListener("click", () => {
        const text = entries.map(e => `${e.time} ${e.tag.toUpperCase()} ${e.msg}`).join("\n");
        navigator.clipboard ? navigator.clipboard.writeText(text) : document.execCommand("copy");
      });
      return {
        info:  (m, o) => add("info", m, o),
        send:  (m, o) => add("send", m, o),
        recv:  (m, o) => add("recv", m, o),
        warn:  (m, o) => add("warn", m, o),
        error: (m, o) => add("error", m, o),
      };
    })();

    // ── FSM bridge ─────────────────────────────────────────────────────────────
    const fsmBridge = {
      isAvailable: !!(window.fsmHost && typeof window.fsmHost.postMessage === "function"),
      send(command, payload) {
        if (!this.isAvailable) {
          dbg.warn("send skipped — bridge unavailable:", command);
          return Promise.resolve(null);
        }
        return new Promise((resolve) => {
          const reqId = "req-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
          let done = false;
          const finish = (detail) => {
            if (done) return;
            done = true;
            clearTimeout(timer);
            window.removeEventListener("fsmHostResponse", handler);
            resolve(detail);
          };
          const handler = (e) => {
            const d = e && e.detail;
            if (!d) return;
            const matches = d.requestId === reqId || (d.success === false && d.requestId == null);
            if (!matches) return;
            if (d.success === false) dbg.error("error response " + command + " (" + reqId + "):", d.error || d);
            else dbg.recv("response " + command + " (" + reqId + "):", d);
            finish(d);
          };
          const timer = setTimeout(() => {
            if (done) return;
            window.removeEventListener("fsmHostResponse", handler);
            done = true;
            dbg.error("timeout after 8s — no response for " + command + " (" + reqId + ")");
            resolve(null);
          }, 8000);
          window.addEventListener("fsmHostResponse", handler);
          try {
            const msg = JSON.stringify({ apiVersion: 1, requestId: reqId, command, payload: payload || {} });
            dbg.send("post " + command + " (" + reqId + "):", msg);
            window.fsmHost.postMessage(msg);
          } catch (err) {
            done = true;
            clearTimeout(timer);
            window.removeEventListener("fsmHostResponse", handler);
            dbg.error("postMessage threw for " + command + ":", err.message);
            resolve({ success: false, error: { code: "POST_FAILED", message: err.message } });
          }
        });
      },
    };

    dbg.info("bridge availability:", {
      fsmHost: typeof window.fsmHost,
      isAvailable: fsmBridge.isAvailable,
      ua: navigator.userAgent,
    });

    window.addEventListener("fsmHostResponse", (e) => {
      dbg.recv("fsmHostResponse event:", e && e.detail);
    });

    // ── Compartment state ──────────────────────────────────────────────────────
    // Each compartment: { id, name, setting, settingNum, serial, rows: [{ alarm, pressure, temp, maxTol, minTol, result }] }
    let nextId = 1;

    function makeCompartment() {
      return {
        id: nextId++,
        name: "",
        setting: "Setting",
        settingNum: "001",
        serial: "",
        rows: [
          { alarm: "Loss", pressure: "0,00", temp: "", maxTol: "5,20",  minTol: "5,00",  result: "" },
          { alarm: "Min1", pressure: "0,00", temp: "", maxTol: "-0,20", minTol: "-0,35", result: "" },
          { alarm: "Min2", pressure: "0,00", temp: "", maxTol: "-0,20", minTol: "-0,35", result: "" },
        ],
      };
    }

    let compartments = [makeCompartment()];

    // ── P20 calculation ────────────────────────────────────────────────────────
    function calcP20(pressure, temp) {
      const p = parseFloat(String(pressure).replace(",", "."));
      const t = parseFloat(String(temp).replace(",", "."));
      if (isNaN(p) || isNaN(t)) return "";
      const p20 = p * (293.15 / (273.15 + t));
      return p20.toFixed(2).replace(".", ",");
    }

    // ── Table rendering ────────────────────────────────────────────────────────
    function renderTable() {
      const tbody = $("gasBody");
      tbody.innerHTML = "";

      compartments.forEach((comp, ci) => {
        comp.rows.forEach((row, ri) => {
          const tr = document.createElement("tr");

          // Column 1: controls (rowspan 3, only on first row)
          if (ri === 0) {
            const ctrlTd = document.createElement("td");
            ctrlTd.className = "comp-ctrl-cell";
            ctrlTd.rowSpan = 3;
            ctrlTd.innerHTML =
              `<span class="ctrl-btn" data-action="add" data-ci="${ci}">+</span>` +
              `<span class="ctrl-btn" data-action="remove" data-ci="${ci}">−</span>` +
              `<span class="ctrl-btn" data-action="up" data-ci="${ci}">↑</span>` +
              `<span class="ctrl-btn" data-action="down" data-ci="${ci}">↓</span>`;
            tr.appendChild(ctrlTd);

            // Column 2: compartment info (rowspan 3)
            const infoTd = document.createElement("td");
            infoTd.className = "comp-info-cell";
            infoTd.rowSpan = 3;
            infoTd.innerHTML =
              `<div class="setting-label">Setting according label</div>` +
              `<input class="comp-name-input" type="text" placeholder="Compartment name" data-ci="${ci}" data-field="name" value="${escVal(comp.name)}" />` +
              `<div class="setting-row">` +
                `<select data-ci="${ci}" data-field="setting">` +
                  `<option${comp.setting === "Setting" ? " selected" : ""}>Setting</option>` +
                  `<option${comp.setting === "Custom" ? " selected" : ""}>Custom</option>` +
                `</select>` +
                `<input type="text" inputmode="numeric" maxlength="3" data-ci="${ci}" data-field="settingNum" value="${escVal(comp.settingNum)}" placeholder="001" />` +
              `</div>` +
              `<div class="sn-row">` +
                `<div class="sn-label">Serial number</div>` +
                `<input type="text" data-ci="${ci}" data-field="serial" value="${escVal(comp.serial)}" placeholder="" />` +
              `</div>`;
            tr.appendChild(infoTd);
          }

          // Column 3: specifications (rowspan 3, only on first row — blank for now)
          if (ri === 0) {
            const specTd = document.createElement("td");
            specTd.rowSpan = 3;
            specTd.style.background = "#f8f9fc";
            specTd.style.fontSize = "11px";
            specTd.style.color = "#555";
            specTd.style.padding = "4px 6px";
            specTd.textContent = "";
            tr.appendChild(specTd);
          }

          // Column 4: alarm name
          const alarmTd = document.createElement("td");
          alarmTd.className = "alarm-cell";
          alarmTd.textContent = row.alarm;
          tr.appendChild(alarmTd);

          // Column 5: pressure
          const presTd = document.createElement("td");
          const presInput = document.createElement("input");
          presInput.type = "number";
          presInput.step = "0.01";
          presInput.placeholder = "0,00";
          presInput.value = row.pressure ? row.pressure.replace(",", ".") : "";
          presInput.dataset.ci = ci;
          presInput.dataset.ri = ri;
          presInput.dataset.field = "pressure";
          presTd.appendChild(presInput);
          tr.appendChild(presTd);

          // Column 6: temp
          const tempTd = document.createElement("td");
          const tempInput = document.createElement("input");
          tempInput.type = "number";
          tempInput.step = "0.1";
          tempInput.placeholder = "";
          tempInput.value = row.temp ? row.temp.replace(",", ".") : "";
          tempInput.dataset.ci = ci;
          tempInput.dataset.ri = ri;
          tempInput.dataset.field = "temp";
          tempTd.appendChild(tempInput);
          tr.appendChild(tempTd);

          // Column 7: P20 (computed, read-only)
          const p20Td = document.createElement("td");
          const p20Input = document.createElement("input");
          p20Input.type = "text";
          p20Input.className = "p20-val";
          p20Input.readOnly = true;
          p20Input.tabIndex = -1;
          p20Input.value = calcP20(row.pressure, row.temp);
          p20Input.id = `p20_${comp.id}_${ri}`;
          p20Td.appendChild(p20Input);
          tr.appendChild(p20Td);

          // Column 8: max tolerance
          const maxTd = document.createElement("td");
          const maxInput = document.createElement("input");
          maxInput.type = "number";
          maxInput.step = "0.01";
          maxInput.className = "tol";
          maxInput.value = row.maxTol ? row.maxTol.replace(",", ".") : "";
          maxInput.dataset.ci = ci;
          maxInput.dataset.ri = ri;
          maxInput.dataset.field = "maxTol";
          maxTd.appendChild(maxInput);
          tr.appendChild(maxTd);

          // Column 9: min tolerance
          const minTd = document.createElement("td");
          const minInput = document.createElement("input");
          minInput.type = "number";
          minInput.step = "0.01";
          minInput.className = "tol";
          minInput.value = row.minTol ? row.minTol.replace(",", ".") : "";
          minInput.dataset.ci = ci;
          minInput.dataset.ri = ri;
          minInput.dataset.field = "minTol";
          minTd.appendChild(minInput);
          tr.appendChild(minTd);

          // Column 10: result
          const resTd = document.createElement("td");
          resTd.className = "result-cell";
          const resSelect = document.createElement("select");
          resSelect.dataset.ci = ci;
          resSelect.dataset.ri = ri;
          resSelect.dataset.field = "result";
          ["", "OK", "Fail", "N/A"].forEach(opt => {
            const o = document.createElement("option");
            o.value = opt;
            o.textContent = opt || "–";
            if (row.result === opt) o.selected = true;
            resSelect.appendChild(o);
          });
          updateResultStyle(resTd, row.result);
          resTd.appendChild(resSelect);
          tr.appendChild(resTd);

          tbody.appendChild(tr);
        });
      });
    }

    function escVal(v) {
      return String(v || "").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    }

    function updateResultStyle(td, val) {
      td.classList.toggle("result-ok", val === "OK");
      td.classList.toggle("result-fail", val === "Fail");
    }

    // ── Table event delegation ─────────────────────────────────────────────────
    $("gasBody").addEventListener("input", (e) => {
      const el = e.target;
      const ci = el.dataset.ci !== undefined ? parseInt(el.dataset.ci) : null;
      const ri = el.dataset.ri !== undefined ? parseInt(el.dataset.ri) : null;
      const field = el.dataset.field;
      if (ci === null || !field) return;

      const comp = compartments[ci];
      if (!comp) return;

      if (ri !== null && ri >= 0) {
        // Row-level field
        comp.rows[ri][field] = el.value;

        // Recompute P20 when pressure or temp changes
        if (field === "pressure" || field === "temp") {
          const row = comp.rows[ri];
          const p20El = $(`p20_${comp.id}_${ri}`);
          if (p20El) p20El.value = calcP20(row.pressure, row.temp);
        }

        // Update result cell style without re-render
        if (field === "result") {
          const td = el.closest("td");
          updateResultStyle(td, el.value);
        }
      } else {
        // Compartment-level field
        comp[field] = el.value;
      }
    });

    $("gasBody").addEventListener("click", (e) => {
      const btn = e.target.closest(".ctrl-btn");
      if (!btn) return;
      const ci = parseInt(btn.dataset.ci);
      const action = btn.dataset.action;

      if (action === "add") {
        compartments.splice(ci + 1, 0, makeCompartment());
      } else if (action === "remove") {
        if (compartments.length === 1) return; // keep at least one
        compartments.splice(ci, 1);
      } else if (action === "up") {
        if (ci === 0) return;
        [compartments[ci - 1], compartments[ci]] = [compartments[ci], compartments[ci - 1]];
      } else if (action === "down") {
        if (ci === compartments.length - 1) return;
        [compartments[ci], compartments[ci + 1]] = [compartments[ci + 1], compartments[ci]];
      }

      renderTable();
    });

    // ── Add compartment button ─────────────────────────────────────────────────
    $("btnAddComp").addEventListener("click", () => {
      compartments.push(makeCompartment());
      renderTable();
    });

    // ── Hide serial number ─────────────────────────────────────────────────────
    $("c_hide_sn").addEventListener("change", (e) => {
      document.body.classList.toggle("hide-serial", e.target.checked);
    });

    // ── Submit ─────────────────────────────────────────────────────────────────
    $("btnSubmit").addEventListener("click", () => {
      const customer = $("h_customer").value.trim();
      const problems = [];
      if (!customer) problems.push("Customer name is required.");
      if (!$("h_contract").value.trim()) problems.push("Contract number is required.");
      if (!$("c_altitude").value) problems.push("Altitude (above sea level) is required.");

      const panel = $("resultPanel");

      if (problems.length) {
        panel.textContent = "Cannot submit:\n– " + problems.join("\n– ");
        panel.className = "result-panel error show";
        return;
      }

      const payload = {
        reportRef: "",
        header: {
          customer,
          consultant:     $("h_consultant").value.trim(),
          substation:     $("h_substation").value.trim(),
          switchgearType: $("h_sgtype").value,
          contractNumber: $("h_contract").value.trim(),
          bayFeeder:      $("h_bay").value.trim(),
          serialNumber:   $("h_serial").value.trim(),
          ratedVoltageKV: $("h_voltage").value ? parseFloat($("h_voltage").value) : null,
        },
        conditions: {
          altitudeAboveSeaLevel: parseFloat($("c_altitude").value),
          altitudeUnit: $("c_alt_unit").value,
          pressureUnit: $("c_unit").value,
        },
        compartments: compartments.map(comp => ({
          name:       comp.name,
          setting:    comp.setting,
          settingNum: comp.settingNum,
          serial:     comp.serial,
          rows: comp.rows.map(row => ({
            alarm:    row.alarm,
            pressure: parseFloat(String(row.pressure).replace(",", ".")) || 0,
            tempC:    row.temp !== "" ? parseFloat(String(row.temp).replace(",", ".")) : null,
            p20:      calcP20(row.pressure, row.temp),
            maxTol:   parseFloat(String(row.maxTol).replace(",", ".")) || 0,
            minTol:   parseFloat(String(row.minTol).replace(",", ".")) || 0,
            result:   row.result,
          })),
        })),
      };

      panel.textContent = JSON.stringify(payload, null, 2);
      panel.className = "result-panel show";

      if (fsmBridge.isAvailable) {
        const activity = {
          subject: "Test report – " + customer,
          remarks: JSON.stringify(payload),
        };
        fsmBridge.send("ACTIVITY_SAVE", activity).then((res) => {
          if (res && res.success === false) dbg.error("ACTIVITY_SAVE failed:", res.error || res);
          else if (res) dbg.info("ACTIVITY_SAVE ok:", res.payload);
        });
      }
    });

    // ── Init ───────────────────────────────────────────────────────────────────
    renderTable();

    (async function loadEquipmentInfo() {
      if (!fsmBridge.isAvailable) {
        dbg.warn("loadEquipmentInfo: bridge unavailable — skipping");
        return;
      }

      // Step 1: get session context to find the current activity ID
      const ctxRes = await fsmBridge.send("CONTEXT_REQUEST", {});
      if (!ctxRes || ctxRes.success === false) {
        dbg.error("loadEquipmentInfo: CONTEXT_REQUEST failed", ctxRes);
        return;
      }
      dbg.info("context:", ctxRes.payload);

      const activityId = ctxRes.payload && ctxRes.payload.activityId;
      if (!activityId) {
        dbg.warn("loadEquipmentInfo: no activityId in context");
        return;
      }

      // Step 2: get the activity to find its equipment ID
      const actRes = await fsmBridge.send("ACTIVITY_GET", { activityId });
      if (!actRes || actRes.success === false) {
        dbg.error("loadEquipmentInfo: ACTIVITY_GET failed", actRes);
        return;
      }
      dbg.info("activity:", actRes.payload);

      const equipmentId = actRes.payload && actRes.payload.equipmentId;
      if (!equipmentId) {
        dbg.warn("loadEquipmentInfo: no equipmentId on activity");
        return;
      }

      // Step 3: get the equipment details and log them
      const eqRes = await fsmBridge.send("EQUIPMENT_GET", { equipmentId });
      if (!eqRes || eqRes.success === false) {
        dbg.error("loadEquipmentInfo: EQUIPMENT_GET failed", eqRes);
        return;
      }
      dbg.info("equipment:", eqRes.payload);
    })();
  </script>
</body>
</html>
