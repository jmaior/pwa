<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Test Report</title>
  <style>
    :root {
      --bar: #354a5f;
      --accent: #0070b8;
      --bg: #f2f2f2;
      --card: #fff;
      --label: #6b6b6b;
      --divider: rgba(0,0,0,0.08);
      --red-border: #c23934;
      --yellow-bg: #fff9c4;
      --tol-bg: #e8eaf0;
      --result-ok: #2e844a;
      --result-fail: #c23934;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    /* ── Top bar ── */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bar);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      padding-top: calc(10px + env(safe-area-inset-top));
    }
    .top-bar .title { font-size: 15px; font-weight: 700; letter-spacing: .3px; }
    .top-bar .ref { font-size: 11px; opacity: .75; text-align: right; line-height: 1.4; }

    /* ── Report heading ── */
    .report-heading {
      background: #fff;
      border-bottom: 2px solid #222;
      padding: 12px 16px 10px;
    }
    .report-heading .en { font-size: 15px; font-weight: 700; }
    .report-heading .sub-en { font-size: 13px; font-weight: 600; margin-top: 8px; }
    .report-heading .tr-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-top: 2px solid #222;
      margin-top: 10px;
      padding-top: 6px;
      gap: 8px;
    }
    .report-heading .tr-label { font-size: 13px; font-weight: 700; }
    .report-heading .tr-label span { font-weight: 400; font-size: 12px; color: #555; }
    .report-heading .tr-code { font-size: 15px; font-weight: 700; }
    .report-heading .tr-ref { font-size: 12px; color: #444; text-align: right; }

    /* ── Page layout ── */
    .page {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 0 80px;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border-radius: 0;
      box-shadow: 0 1px 0 var(--divider);
      padding: 0 16px;
      margin-bottom: 8px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--label);
      padding: 10px 0 6px;
      border-bottom: 1px solid var(--divider);
    }

    /* ── Two-column header grid ── */
    .header-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 16px;
    }
    @media (max-width: 500px) {
      .header-grid { grid-template-columns: 1fr; }
    }
    .field {
      padding: 9px 0;
      border-bottom: 1px solid var(--divider);
    }
    .field:last-child { border-bottom: none; }
    .lbl {
      font-size: 11px;
      color: var(--label);
      line-height: 1.3;
      margin-bottom: 4px;
    }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      font-size: 14px;
      padding: 5px 7px;
      border: 1px solid #c8c8c8;
      border-radius: 4px;
      background: #eef2fb;
      color: #1a1a1a;
      appearance: none;
      -webkit-appearance: none;
    }
    input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }
    .inline-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .inline-row input, .inline-row select { flex: 1; }
    .unit-label { font-size: 13px; font-weight: 600; white-space: nowrap; }

    /* ── Conditions bar ── */
    .conditions-card {
      background: var(--card);
      box-shadow: 0 1px 0 var(--divider);
      padding: 10px 16px;
      margin-bottom: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      align-items: flex-end;
    }
    .cond-group { display: flex; flex-direction: column; gap: 4px; }
    .cond-group .lbl { margin-bottom: 0; }
    .cond-group .inline-row input[type="number"] { width: 80px; }
    .red-border input { border-color: var(--red-border) !important; border-width: 2px !important; }
    .highlighted select { border-color: var(--red-border) !important; border-width: 2px !important; }
    .hide-sn-label {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--yellow-bg);
      border: 1px solid #e0c800;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .hide-sn-label input[type="checkbox"] {
      width: 16px; height: 16px;
      flex-shrink: 0;
      border: 1px solid #888;
      background: #fff;
      border-radius: 2px;
      appearance: auto;
      -webkit-appearance: auto;
    }

    /* ── Compartment cards ── */
    .comp-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 12px 8px;
    }
    .comp-card {
      background: var(--card);
      border: 1px solid #c8cdd8;
      border-radius: 8px;
      overflow: hidden;
    }
    .comp-card-header {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #e6e9ef;
      padding: 6px 8px;
      border-bottom: 1px solid #c8cdd8;
    }
    .comp-card-header input.comp-name-input {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      background: #fff;
      border: 1px solid #b0b8c8;
      border-radius: 4px;
      padding: 4px 6px;
    }
    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      font-size: 15px;
      font-weight: 700;
      background: #d0d4e0;
      border: 1px solid #aab;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }
    .ctrl-btn:active { background: #b0b8cc; }
    .comp-card-meta {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      padding: 6px 8px 4px;
      border-bottom: 1px solid #e0e3ea;
      flex-wrap: wrap;
    }
    .comp-card-meta .meta-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .comp-card-meta .meta-lbl {
      font-size: 10px;
      color: #666;
    }
    .comp-card-meta select, .comp-card-meta input[type="text"] {
      font-size: 12px;
      padding: 3px 5px;
      background: #eef2fb;
      border: 1px solid #b0b8c8;
      border-radius: 3px;
    }
    .sn-row { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 100px; }
    body.hide-serial .sn-row { display: none; }
    .comp-alarm-row {
      display: grid;
      grid-template-columns: 42px 1fr 1fr 1fr 1fr 1fr 80px;
      gap: 4px;
      align-items: center;
      padding: 5px 8px;
      border-top: 1px solid #e8eaef;
    }
    .comp-alarm-row:first-of-type { border-top: none; }
    .alarm-label {
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      color: #333;
    }
    @keyframes label-blink {
      0%   { background: #fff9c4; color: #b45309; }
      40%  { background: #fef08a; color: #92400e; }
      100% { background: transparent; color: #333; }
    }
    .alarm-label.blink { animation: label-blink 0.7s ease-out forwards; }
    @keyframes tol-blink {
      0%   { background: #bbf7d0; }
      40%  { background: #4ade80; }
      100% { background: var(--tol-bg); }
    }
    .tol.blink { animation: tol-blink 0.7s ease-out forwards; }
    .comp-alarm-row .fld {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .comp-alarm-row .fld-lbl {
      font-size: 9px;
      color: #777;
      white-space: nowrap;
    }
    .comp-alarm-row input[type="number"],
    .comp-alarm-row input[type="text"] {
      width: 100%;
      font-size: 12px;
      padding: 3px 4px;
      background: #eef2fb;
      border: 1px solid #b0b8c8;
      border-radius: 3px;
      min-width: 0;
    }
    .comp-alarm-row input.p20-val {
      background: #f0f0f0;
      color: #555;
    }
    .comp-alarm-row input.tol { background: var(--tol-bg); }
    .comp-alarm-row select {
      width: 100%;
      font-size: 12px;
      padding: 3px 4px;
      border: 1px solid #b0b8c8;
      border-radius: 3px;
      min-width: 0;
    }
    .alarm-row-ok  { background: #d4edda44; }
    .alarm-row-fail { background: #f8d7da66; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: .85; }
    .btn.secondary { background: #e0e4ea; color: #1a1a1a; }
    .btn.add-comp { background: #fff; border: 1px solid var(--accent); color: var(--accent); width: 100%; margin: 6px 0 4px; }

    /* ── Submit area ── */
    .submit-area {
      padding: 12px 16px;
      background: var(--card);
      box-shadow: 0 1px 0 var(--divider);
      margin-bottom: 8px;
    }
    .submit-area .btn { width: 100%; }

    .result-panel {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      background: #f0f8f0;
      border: 1px solid #9ec;
      border-radius: 6px;
      font-size: 11px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 260px;
      overflow-y: auto;
    }
    .result-panel.error { background: #fff0f0; border-color: #f9a; }
    .result-panel.show { display: block; }

    /* ── Debug log ── */
    .dbg-wrap {
      margin: 8px 16px 16px;
      border-radius: 6px;
      overflow: hidden;
      font-size: 11px;
    }
    .dbg-head {
      display: flex;
      align-items: center;
      background: #2a2a2a;
      color: #ccc;
      padding: 6px 10px;
      cursor: pointer;
      user-select: none;
      gap: 8px;
    }
    .dbg-head .dbg-toggle { font-family: monospace; }
    .dbg-head .dbg-copy { margin-left: auto; font-size: 11px; color: #aaa; cursor: pointer; }
    .dbg-body {
      background: #1a1a1a;
      color: #e0e0e0;
      max-height: 800px;
      overflow-y: auto;
      padding: 6px 10px;
      font-family: monospace;
    }
    .dbg-wrap.collapsed .dbg-body { display: none; }
    .dbg-entry { margin-bottom: 2px; line-height: 1.5; }
    .dbg-time { color: #666; margin-right: 6px; }
    .dbg-tag { padding: 1px 5px; border-radius: 3px; margin-right: 5px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .dbg-tag.info  { background: #1e3a5f; color: #7ec8e3; }
    .dbg-tag.send  { background: #0d3d2a; color: #5dd39e; }
    .dbg-tag.recv  { background: #3a2a00; color: #ffc94a; }
    .dbg-tag.warn  { background: #3a2a00; color: #ffc94a; }
    .dbg-tag.error { background: #4a1010; color: #f88; }
  </style>
</head>
<body>

  <div class="top-bar">
  </div>

  <div class="page">

    <!-- Report heading -->
    <div class="report-heading">
      <div class="tr-row">
        <div>
          <span class="tr-label">Test report</span>
        </div>
      </div>
    </div>

    <!-- Header fields -->
    <div class="card" style="margin-top:8px;">
      <div class="header-grid">
        <!-- Left column -->
        <div>
          <div class="field">
            <div class="lbl">Equipment Name</div>
            <input type="text" id="h_bay" placeholder="" />
          </div>
          <div class="field">
            <div class="lbl">Serial number</div>
            <input type="text" id="h_serial" placeholder="" />
          </div>
          <div class="field" style="border-bottom:none;">
            <div class="lbl">Rated voltage</div>
            <div class="inline-row">
              <input type="number" id="h_voltage" inputmode="decimal" placeholder="0" min="0" step="0.1" />
              <span class="unit-label">kV</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Measurement conditions -->
    <div class="conditions-card">
      <div class="cond-group red-border">
        <div class="lbl">Above sea level</div>
        <div class="inline-row">
          <input type="number" id="c_altitude" inputmode="decimal" placeholder="0" min="0" />
          <select id="c_alt_unit" style="width:60px;">
            <option>m</option>
            <option>ft</option>
          </select>
        </div>
      </div>
      <div class="cond-group highlighted">
        <div class="lbl">Unit</div>
        <select id="c_unit" style="width:130px;">
          <option>bar (rel.)</option>
          <option>bar (abs.)</option>
          <option>MPa</option>
          <option>psi (rel.)</option>
        </select>
      </div>
      <div class="cond-group">
        <label class="hide-sn-label">
          Hide Serial Number
          <input type="checkbox" id="c_hide_sn" />
        </label>
      </div>
    </div>

    <!-- Compartments -->
    <div id="gasBody" class="comp-list"></div>

    <div style="padding: 0 16px 4px;">
      <button class="btn add-comp" id="btnAddComp">+ Add compartment</button>
    </div>

    <!-- Submit -->
    <div class="submit-area">
      <button class="btn" id="btnSubmit">Submit report</button>
      <div class="result-panel" id="resultPanel"></div>
    </div>

    <!-- Debug log -->
    <div class="dbg-wrap collapsed" id="dbgWrap">
      <div class="dbg-head" id="dbgHead">
        <span class="dbg-toggle">▶</span>
        <span>Debug log</span>
        <span class="dbg-copy" id="dbgCopy">Copy</span>
      </div>
      <div class="dbg-body" id="dbgBody"></div>
    </div>

  </div><!-- .page -->

  <script>
    const $ = id => document.getElementById(id);

    // ── Debug log ──────────────────────────────────────────────────────────────
    const dbg = (function () {
      const entries = [];
      function render() {
        const el = $("dbgBody");
        if (!el) return;
        el.innerHTML = entries.map(e =>
          `<div class="dbg-entry"><span class="dbg-time">${e.time}</span>` +
          `<span class="dbg-tag ${e.tag}">${e.tag}</span>${e.msg}</div>`
        ).join("");
        el.scrollTop = el.scrollHeight;
      }
      function add(tag, msg, obj) {
        if (obj !== undefined) {
          let s;
          try { s = typeof obj === "string" ? obj : JSON.stringify(obj); }
          catch (err) { s = "[unserializable: " + err.message + "]"; }
          msg += " " + s;
        }
        entries.push({ time: new Date().toISOString().slice(11, 23), tag, msg });
        render();
      }
      $("dbgHead").addEventListener("click", (e) => {
        if (e.target.id === "dbgCopy") return;
        $("dbgWrap").classList.toggle("collapsed");
        $("dbgWrap").querySelector(".dbg-toggle").textContent =
          $("dbgWrap").classList.contains("collapsed") ? "▶" : "▼";
      });
      $("dbgCopy").addEventListener("click", () => {
        const text = entries.map(e => `${e.time} ${e.tag.toUpperCase()} ${e.msg}`).join("\n");
        navigator.clipboard ? navigator.clipboard.writeText(text) : document.execCommand("copy");
      });
      return {
        info:  (m, o) => add("info", m, o),
        send:  (m, o) => add("send", m, o),
        recv:  (m, o) => add("recv", m, o),
        warn:  (m, o) => add("warn", m, o),
        error: (m, o) => add("error", m, o),
      };
    })();

    // ── FSM bridge ─────────────────────────────────────────────────────────────
    const fsmBridge = {
      isAvailable: !!(window.fsmHost && typeof window.fsmHost.postMessage === "function"),
      send(command, payload) {
        if (!this.isAvailable) {
          dbg.warn("send skipped — bridge unavailable:", command);
          return Promise.resolve(null);
        }
        return new Promise((resolve) => {
          const reqId = "req-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
          let done = false;
          const finish = (detail) => {
            if (done) return;
            done = true;
            clearTimeout(timer);
            window.removeEventListener("fsmHostResponse", handler);
            resolve(detail);
          };
          const handler = (e) => {
            const d = e && e.detail;
            if (!d) return;
            const matches = d.requestId === reqId || (d.success === false && d.requestId == null);
            if (!matches) return;
            if (d.success === false) dbg.error("error response " + command + " (" + reqId + "):", d.error || d);
            else dbg.recv("response " + command + " (" + reqId + "):", d);
            finish(d);
          };
          const timer = setTimeout(() => {
            if (done) return;
            window.removeEventListener("fsmHostResponse", handler);
            done = true;
            dbg.error("timeout after 8s — no response for " + command + " (" + reqId + ")");
            resolve(null);
          }, 8000);
          window.addEventListener("fsmHostResponse", handler);
          try {
            const msg = JSON.stringify({ apiVersion: 1, requestId: reqId, command, payload: payload || {} });
            dbg.send("post " + command + " (" + reqId + "):", msg);
            window.fsmHost.postMessage(msg);
          } catch (err) {
            done = true;
            clearTimeout(timer);
            window.removeEventListener("fsmHostResponse", handler);
            dbg.error("postMessage threw for " + command + ":", err.message);
            resolve({ success: false, error: { code: "POST_FAILED", message: err.message } });
          }
        });
      },
    };

    dbg.info("bridge availability:", {
      fsmHost: typeof window.fsmHost,
      isAvailable: fsmBridge.isAvailable,
      ua: navigator.userAgent,
    });

    window.addEventListener("fsmHostResponse", (e) => {
      dbg.recv("fsmHostResponse event:", e && e.detail);
    });
    // ── Compartment state ──────────────────────────────────────────────────────
    // Each compartment: { id, name, setting, settingNum, serial, rows: [{ alarm, pressure, temp, maxTol, minTol, result }] }
    let nextId = 1;

    // ── Alarm labels by No. range ──────────────────────────────────────────────
    function alarmLabels(settingNum) {
      const n = parseInt(settingNum, 10);
      if (n >= 401 && n <= 402) return ["Loss P20", "Min", "Rising"];
      if (n >= 607 && n <= 608) return ["Loss P20", "Min", "Loss P20"];
      return ["Loss P20", "Min1", "Min2"]; // 001–004 default
    }

    // ── Loss row tolerances by No. ─────────────────────────────────────────────
    const LOSS_TOL = {
      "001": { max: "5.2",  min: "5"   },
      "002": { max: "4.5",  min: "4.3" },
      "003": { max: "6.7",  min: "6.5" },
      "004": { max: "5.7",  min: "5.5" },
      "401": { max: "2.7",  min: "2.5" },
      "402": { max: "3.2",  min: "3"   },
      "607": { max: "6.7",  min: "6.5" },
      "608": { max: "7.2",  min: "7"   },
    };

    function makeCompartment(settingNum = "001") {
      const labels = alarmLabels(settingNum);
      const tol = LOSS_TOL[settingNum] || { max: "5.2", min: "5" };
      return {
        id: nextId++,
        name: "",
        setting: "Setting",
        settingNum,
        serial: "",
        rows: [
          { alarm: labels[0], pressure: "0,00", temp: "", maxTol: tol.max,  minTol: tol.min,  result: "" },
          { alarm: labels[1], pressure: "0,00", temp: "", maxTol: "-0.20", minTol: "-0.35", result: "" },
          { alarm: labels[2], pressure: "0,00", temp: "", maxTol: "-0.20", minTol: "-0.35", result: "" },
        ],
      };
    }

    let compartments = [makeCompartment()];

    function calcP20(pressure, temp) {
      const p = parseFloat(String(pressure).replace(",", "."));
      const t = parseFloat(String(temp).replace(",", "."));
      if (isNaN(p) || isNaN(t)) return "";
      const p20 = p * (293.15 / (273.15 + t));
      return p20.toFixed(2).replace(".", ",");
    }

    // ── Card rendering ─────────────────────────────────────────────────────────
    function renderTable() {
      const list = $("gasBody");
      list.innerHTML = "";

      compartments.forEach((comp, ci) => {
        const card = document.createElement("div");
        card.className = "comp-card";

        // Header: name input + control buttons
        const hdr = document.createElement("div");
        hdr.className = "comp-card-header";
        hdr.innerHTML =
          `<input class="comp-name-input" type="text" placeholder="Compartment name" data-ci="${ci}" data-field="name" value="${escVal(comp.name)}" />` +
          `<span class="ctrl-btn" data-action="up"     data-ci="${ci}">↑</span>` +
          `<span class="ctrl-btn" data-action="down"   data-ci="${ci}">↓</span>` +
          `<span class="ctrl-btn" data-action="add"    data-ci="${ci}">+</span>` +
          `<span class="ctrl-btn" data-action="remove" data-ci="${ci}">−</span>`;
        card.appendChild(hdr);

        // Meta: setting + serial number
        const meta = document.createElement("div");
        meta.className = "comp-card-meta";
        meta.innerHTML =
          `<div class="meta-group">` +
            `<div class="meta-lbl">Setting</div>` +
            `<select data-ci="${ci}" data-field="setting">` +
              `<option${comp.setting === "Setting" ? " selected" : ""}>Setting</option>` +
              `<option${comp.setting === "Custom"  ? " selected" : ""}>Custom</option>` +
            `</select>` +
          `</div>` +
          `<div class="meta-group">` +
            `<div class="meta-lbl">No.</div>` +
            `<select data-ci="${ci}" data-field="settingNum">` +
              `${["001","002","003","004","401","402","607","608"].map(v =>
                `<option value="${v}"${comp.settingNum===v?" selected":""}>${v}</option>`).join("")}` +
            `</select>` +
          `</div>` +
          `<div class="sn-row">` +
            `<div class="meta-lbl">Serial number</div>` +
            `<input type="text" data-ci="${ci}" data-field="serial" value="${escVal(comp.serial)}" placeholder="" />` +
          `</div>`;
        card.appendChild(meta);

        // Alarm rows
        const labels = alarmLabels(comp.settingNum);
        comp.rows.forEach((row, ri) => {
          const alarmRow = document.createElement("div");
          alarmRow.className = "comp-alarm-row";
          if (row.result === "OK")   alarmRow.classList.add("alarm-row-ok");
          if (row.result === "Fail") alarmRow.classList.add("alarm-row-fail");

          alarmRow.innerHTML =
            `<div class="alarm-label">${labels[ri]}</div>` +
            `<div class="fld"><div class="fld-lbl">Pressure</div>` +
              `<input type="number" step="0.01" placeholder="0.00" data-ci="${ci}" data-ri="${ri}" data-field="pressure" value="${row.pressure ? row.pressure.replace(",", ".") : ""}"/></div>` +
            `<div class="fld"><div class="fld-lbl">Temp °C</div>` +
              `<input type="number" step="0.1" data-ci="${ci}" data-ri="${ri}" data-field="temp" value="${row.temp ? row.temp.replace(",", ".") : ""}"/></div>` +
            `<div class="fld"><div class="fld-lbl">P20</div>` +
              `<input type="text" class="p20-val" readonly tabindex="-1" id="p20_${comp.id}_${ri}" value="${calcP20(row.pressure, row.temp)}"/></div>` +
            `<div class="fld"><div class="fld-lbl">Max tol.</div>` +
              `<input type="number" step="0.01" class="tol" data-ci="${ci}" data-ri="${ri}" data-field="maxTol" value="${row.maxTol ? row.maxTol.replace(",", ".") : ""}"/></div>` +
            `<div class="fld"><div class="fld-lbl">Min tol.</div>` +
              `<input type="number" step="0.01" class="tol" data-ci="${ci}" data-ri="${ri}" data-field="minTol" value="${row.minTol ? row.minTol.replace(",", ".") : ""}"/></div>` +
            `<div class="fld"><div class="fld-lbl">Result</div>` +
              `<select data-ci="${ci}" data-ri="${ri}" data-field="result">` +
                `<option value="">–</option>` +
                `<option value="OK"${row.result==="OK"?" selected":""}>OK</option>` +
                `<option value="Fail"${row.result==="Fail"?" selected":""}>Fail</option>` +
                `<option value="N/A"${row.result==="N/A"?" selected":""}>N/A</option>` +
              `</select></div>`;

          card.appendChild(alarmRow);
        });

        list.appendChild(card);
      });
    }

    function escVal(v) {
      return String(v || "").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    }

    // ── Card event delegation ──────────────────────────────────────────────────
    $("gasBody").addEventListener("input", (e) => {
      const el = e.target;
      const ci = el.dataset.ci !== undefined ? parseInt(el.dataset.ci) : null;
      const ri = el.dataset.ri !== undefined ? parseInt(el.dataset.ri) : null;
      const field = el.dataset.field;
      if (ci === null || !field) return;

      const comp = compartments[ci];
      if (!comp) return;

      if (ri !== null && ri >= 0) {
        comp.rows[ri][field] = el.value;

        if (field === "pressure" || field === "temp") {
          const row = comp.rows[ri];
          const p20El = $(`p20_${comp.id}_${ri}`);
          if (p20El) p20El.value = calcP20(row.pressure, row.temp);
        }

        if (field === "result") {
          const alarmRow = el.closest(".comp-alarm-row");
          if (alarmRow) {
            alarmRow.classList.toggle("alarm-row-ok",   el.value === "OK");
            alarmRow.classList.toggle("alarm-row-fail", el.value === "Fail");
          }
        }
      } else {
        if (field === "settingNum") {
          const prev = comp.settingNum;
          const prevLabels = alarmLabels(prev);
          const newLabels  = alarmLabels(el.value);
          const labelsChanged = prevLabels.some((l, i) => l !== newLabels[i]);
          const prevTol = LOSS_TOL[prev] || { max: "5.2", min: "5" };
          const newTol  = LOSS_TOL[el.value] || { max: "5.2", min: "5" };
          const tolChanged = prevTol.max !== newTol.max || prevTol.min !== newTol.min;
          comp[field] = el.value;
          comp.rows[0].maxTol = newTol.max;
          comp.rows[0].minTol = newTol.min;
          renderTable();
          const card = $("gasBody").children[ci];
          if (card) {
            if (labelsChanged) {
              card.querySelectorAll(".alarm-label").forEach(lbl => {
                lbl.classList.remove("blink");
                void lbl.offsetWidth;
                lbl.classList.add("blink");
              });
            }
            if (tolChanged) {
              card.querySelectorAll(".comp-alarm-row:first-of-type .tol").forEach(inp => {
                inp.classList.remove("blink");
                void inp.offsetWidth;
                inp.classList.add("blink");
              });
            }
          }
        } else {
          comp[field] = el.value;
        }
      }
    });

    $("gasBody").addEventListener("click", (e) => {
      const btn = e.target.closest(".ctrl-btn");
      if (!btn) return;
      const ci = parseInt(btn.dataset.ci);
      const action = btn.dataset.action;

      if (action === "add") {
        compartments.splice(ci + 1, 0, makeCompartment());
      } else if (action === "remove") {
        if (compartments.length === 1) return;
        compartments.splice(ci, 1);
      } else if (action === "up") {
        if (ci === 0) return;
        [compartments[ci - 1], compartments[ci]] = [compartments[ci], compartments[ci - 1]];
      } else if (action === "down") {
        if (ci === compartments.length - 1) return;
        [compartments[ci], compartments[ci + 1]] = [compartments[ci + 1], compartments[ci]];
      }

      renderTable();
    });

    // ── Add compartment button ─────────────────────────────────────────────────
    $("btnAddComp").addEventListener("click", () => {
      compartments.push(makeCompartment());
      renderTable();
    });

    // ── Hide serial number ─────────────────────────────────────────────────────
    $("c_hide_sn").addEventListener("change", (e) => {
      document.body.classList.toggle("hide-serial", e.target.checked);
    });

    // ── Submit ─────────────────────────────────────────────────────────────────
    $("btnSubmit").addEventListener("click", () => {
      const problems = [];
      if (!$("c_altitude").value) problems.push("Altitude (above sea level) is required.");

      const panel = $("resultPanel");

      if (problems.length) {
        panel.textContent = "Cannot submit:\n– " + problems.join("\n– ");
        panel.className = "result-panel error show";
        return;
      }

      const payload = {
        reportRef: "",
        header: {
          equipmentName:  $("h_bay").value.trim(),
          serialNumber:   $("h_serial").value.trim(),
          ratedVoltageKV: $("h_voltage").value ? parseFloat($("h_voltage").value) : null,
        },
        conditions: {
          altitudeAboveSeaLevel: parseFloat($("c_altitude").value),
          altitudeUnit: $("c_alt_unit").value,
          pressureUnit: $("c_unit").value,
        },
        compartments: compartments.map(comp => ({
          name:       comp.name,
          setting:    comp.setting,
          settingNum: comp.settingNum,
          serial:     comp.serial,
          rows: comp.rows.map((row, ri) => ({
            alarm:    alarmLabels(comp.settingNum)[ri],
            pressure: parseFloat(String(row.pressure).replace(",", ".")) || 0,
            tempC:    row.temp !== "" ? parseFloat(String(row.temp).replace(",", ".")) : null,
            p20:      calcP20(row.pressure, row.temp),
            maxTol:   parseFloat(String(row.maxTol).replace(",", ".")) || 0,
            minTol:   parseFloat(String(row.minTol).replace(",", ".")) || 0,
            result:   row.result,
          })),
        })),
      };

      panel.textContent = JSON.stringify(payload, null, 2);
      panel.className = "result-panel show";

      if (fsmBridge.isAvailable) {
        const activity = {
          subject: "Test report – " + ($("h_bay").value.trim() || "Gas Monitoring"),
          remarks: JSON.stringify(payload),
        };
        fsmBridge.send("ACTIVITY_SAVE", activity).then((res) => {
          if (res && res.success === false) dbg.error("ACTIVITY_SAVE failed:", res.error || res);
          else if (res) dbg.info("ACTIVITY_SAVE ok:", res.payload);
        });
      }
    });

    // ── Init ───────────────────────────────────────────────────────────────────
    renderTable();

    (async function loadActivityInfo() {
      if (!fsmBridge.isAvailable) {
        dbg.warn("bridge unavailable — skipping activity load");
        return;
      }

      const ctxRes = await fsmBridge.send("CONTEXT_REQUEST", {});
      if (!ctxRes || ctxRes.success === false) {
        dbg.error("CONTEXT_REQUEST failed", ctxRes);
        return;
      }
      dbg.info("context keys:", Object.keys(ctxRes.payload || {}));
      dbg.info("context:", ctxRes.payload);

      const urlActivityId = new URLSearchParams(window.location.search).get("activityId");
      const activityId = urlActivityId ||
        (ctxRes.payload.objectType === "ACTIVITY" && ctxRes.payload.cloudId) ||
        ctxRes.payload.activityId ||
        ctxRes.payload.activity_id ||
        ctxRes.payload.objectId;
      dbg.info("activityId source:", urlActivityId ? "URL param" : "context.cloudId");
      dbg.info("activityId:", activityId);
      if (!activityId) {
        dbg.warn("no activity ID in context — PWA must be opened from an activity in FSM, not standalone");
        return;
      }

      const actRes = await fsmBridge.send("ACTIVITY_GET", { activityId });
      if (!actRes || actRes.success === false) {
        dbg.error("ACTIVITY_GET failed", actRes);
        return;
      }
      dbg.warn("▶ ACTIVITY:", actRes.payload);

      const act = actRes.payload || {};

      const equipmentId = actRes.payload && (
        actRes.payload.equipmentId ||
        actRes.payload.equipment_id ||
        actRes.payload.equipment
      );
      if (!equipmentId) {
        dbg.warn("no equipmentId on activity — keys:", Object.keys(actRes.payload || {}));
        return;
      }
      dbg.info("equipmentId:", equipmentId);

      const eqRes = await fsmBridge.send("EQUIPMENT_GET", { equipmentId });
      if (!eqRes || eqRes.success === false) {
        dbg.error("EQUIPMENT_GET failed", eqRes);
        return;
      }
      dbg.warn("▶ EQUIPMENT:", eqRes.payload);
      const eq = eqRes.payload || {};
      if (eq.name)         { $("h_bay").value    = eq.name;         dbg.info("bay/feeder populated from equipment.name:", eq.name); }
      if (eq.serialNumber) { $("h_serial").value = eq.serialNumber; dbg.info("serial number populated from equipment.serialNumber:", eq.serialNumber); }
    })();
  </script>
</body>
</html>
