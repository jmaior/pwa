<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello World</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #000; }
    body { font-family: "Courier New", monospace; }
    canvas { display: block; position: fixed; inset: 0; }
    .hello {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #9dffa2;
      font-size: 12vw;
      font-weight: 700;
      letter-spacing: 3px;
      text-shadow: 0 0 8px #0f0, 0 0 20px #0f0, 0 0 40px #0a0;
      white-space: nowrap;
      animation: flicker 3s infinite;
    }
    @keyframes flicker {
      0%, 100%   { opacity: 1; }
      92%        { opacity: 1; }
      93%        { opacity: 0.4; }
      94%        { opacity: 1; }
      96%        { opacity: 0.7; }
      97%        { opacity: 1; }
    }
    @media (min-width: 700px) { .hello { font-size: 80px; } }

    #bt-btn {
      position: fixed;
      bottom: 18px;
      right: 18px;
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 10;
    }
    #bt-btn:hover, #bt-btn:focus { opacity: 0.6; }
    #bt-btn svg { width: 100%; height: 100%; fill: #0f0; }

    #bt-panel {
      display: none;
      position: fixed;
      bottom: 64px;
      right: 18px;
      background: #0a0a0a;
      border: 1px solid #0f0;
      border-radius: 6px;
      padding: 14px 16px;
      color: #9dffa2;
      font-family: "Courier New", monospace;
      font-size: 13px;
      min-width: 240px;
      z-index: 10;
      box-shadow: 0 0 12px #0f04;
    }
    #bt-panel.open { display: block; }
    #bt-panel h2 { font-size: 13px; margin-bottom: 10px; letter-spacing: 1px; color: #0f0; }
    #bt-panel button {
      background: #001a00;
      border: 1px solid #0f0;
      color: #9dffa2;
      font-family: inherit;
      font-size: 12px;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 3px;
      margin-top: 4px;
      width: 100%;
    }
    #bt-panel button:hover { background: #003300; }
    #bt-probes { margin-top: 10px; border-top: 1px dashed #0f04; padding-top: 8px; }
    .probe-label { font-size: 10px; color: #0f0; letter-spacing: 1px; margin-bottom: 6px; }
    #bt-log {
      margin-top: 10px;
      max-height: 120px;
      overflow-y: auto;
      font-size: 11px;
      color: #6fcf72;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <h1 class="hello">Hello World</h1>

  <!-- hidden Bluetooth trigger — visible only on hover/focus -->
  <button id="bt-btn" title="Bluetooth" aria-label="Open Bluetooth reader">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M17.71 7.71 12 2h-1v7.59L6.41 5 5 6.41l5.59 5.59L5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/>
    </svg>
  </button>

  <div id="bt-panel" hidden role="dialog" aria-label="Bluetooth reader">
    <h2>BLUETOOTH READER</h2>
    <button id="bt-scan">Scan &amp; Connect</button>
    <button id="bt-disconnect" style="display:none">Disconnect</button>

    <div id="bt-probes">
      <div class="probe-label">ESCAPE OPTIONS — try each:</div>
      <button data-probe="intent">1. Intent → Chrome</button>
      <button data-probe="chrome">2. googlechrome://</button>
      <button data-probe="mainframe">3. Open (top frame)</button>
      <button data-probe="blank">4. Open new tab</button>
      <button data-probe="anchor">5. Tap-through link</button>
      <button data-probe="copy">6. Copy URL</button>
      <button data-probe="diag">7. Show diagnostics</button>
    </div>

    <div id="bt-log"></div>
  </div>

  <script>
    var canvas = document.getElementById("matrix");
    var ctx = canvas.getContext("2d");
    var chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEFHELLOWORLD".split("");
    var fontSize = 16;
    var columns, drops;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      columns = Math.floor(canvas.width / fontSize);
      drops = [];
      for (var i = 0; i < columns; i++) {
        drops[i] = Math.floor(Math.random() * -canvas.height / fontSize);
      }
    }
    resize();
    window.addEventListener("resize", resize);

    function draw() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.06)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0f0";
      ctx.font = fontSize + "px monospace";
      for (var i = 0; i < drops.length; i++) {
        var text = chars[Math.floor(Math.random() * chars.length)];
        var x = i * fontSize;
        var y = drops[i] * fontSize;
        ctx.fillText(text, x, y);
        if (y > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(draw, 50);
  </script>

  <script>
    (function () {
      var btn = document.getElementById("bt-btn");
      var panel = document.getElementById("bt-panel");
      var scanBtn = document.getElementById("bt-scan");
      var disconnectBtn = document.getElementById("bt-disconnect");
      var log = document.getElementById("bt-log");
      var server = null;

      btn.addEventListener("click", function () {
        if (panel.hidden) {
          panel.hidden = false;
          panel.classList.add("open");
        } else {
          panel.hidden = true;
          panel.classList.remove("open");
        }
      });

      function write(msg) {
        log.textContent = msg + "\n" + log.textContent;
      }

      // --- Escape-option probes (always available) ---
      var url = location.href;
      var host = url.replace(/^https?:\/\//, "");

      function copyUrl() {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url)
            .then(function () { write("Copied URL to clipboard."); })
            .catch(function (e) { write("Copy failed: " + e.message); });
        } else {
          write("Clipboard API unavailable. URL:\n" + url);
        }
      }

      var probes = {
        intent: function () {
          write("Trying intent:// …");
          window.location.href = "intent://" + host +
            "#Intent;scheme=https;package=com.android.chrome;end";
        },
        chrome: function () {
          write("Trying googlechrome(s):// …");
          window.location.href = url.replace(/^https:\/\//, "googlechromes://")
                                    .replace(/^http:\/\//, "googlechrome://");
        },
        mainframe: function () {
          write("Trying top-frame navigation …");
          try { window.top.location.href = url; }
          catch (e) { write("Blocked: " + e.message); }
        },
        blank: function () {
          write("Trying window.open new tab …");
          var w = window.open(url, "_blank");
          if (!w) write("window.open returned null (blocked).");
        },
        anchor: function () {
          write("Injected a real link below — tap it.");
          var a = document.createElement("a");
          a.href = url;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = ">> TAP TO OPEN: " + url;
          a.style.cssText = "color:#0f0;display:block;margin-top:8px;word-break:break-all;text-decoration:underline;";
          log.appendChild(a);
        },
        copy: copyUrl,
        diag: function () {
          var d = [
            "UA: " + navigator.userAgent,
            "bluetooth: " + (!!navigator.bluetooth),
            "clipboard: " + (!!navigator.clipboard),
            "serial: " + (!!navigator.serial),
            "usb: " + (!!navigator.usb),
            "hid: " + (!!navigator.hid),
            "geolocation: " + (!!navigator.geolocation),
            "secureContext: " + window.isSecureContext,
            "origin: " + location.origin,
            "in iframe: " + (window.self !== window.top)
          ].join("\n");
          write(d);
        }
      };

      var probeButtons = panel.querySelectorAll("#bt-probes button");
      for (var p = 0; p < probeButtons.length; p++) {
        (function (b) {
          b.addEventListener("click", function () {
            var fn = probes[b.getAttribute("data-probe")];
            if (fn) fn();
          });
        })(probeButtons[p]);
      }

      // --- Real Bluetooth scan (only if supported) ---
      if (!navigator.bluetooth) {
        write("Web Bluetooth not available here.\nUse an escape option below, or option 7 for diagnostics.");
        scanBtn.style.display = "none";
      } else {
        scanBtn.addEventListener("click", function () {
          write("Scanning…");
          navigator.bluetooth.requestDevice({ acceptAllDevices: true })
            .then(function (device) {
              write("Found: " + device.name + " (" + device.id + ")");
              return device.gatt.connect().then(function (s) {
                server = s;
                write("Connected to GATT server.");
                disconnectBtn.style.display = "";
                scanBtn.style.display = "none";
                device.addEventListener("gattserverdisconnected", function () {
                  write("Disconnected.");
                  disconnectBtn.style.display = "none";
                  scanBtn.style.display = "";
                  server = null;
                });
                return s.getPrimaryServices();
              });
            })
            .then(function (services) {
              write("Services (" + services.length + "):");
              services.forEach(function (s) { write("  " + s.uuid); });
            })
            .catch(function (err) {
              write("Error: " + err.message);
            });
        });

        disconnectBtn.addEventListener("click", function () {
          if (server && server.connected) {
            server.disconnect();
          }
        });
      }
    })();
  </script>
</body>
</html>
